    blocks: [
      { level: 4, kind: "panel", art: "fastAppend", headline: "Always add at the end",
        text: "Pinni only ever adds notes at the end of a column, so the disk writes in one smooth line instead of jumping around. Recent notes stay in the building's front room, the operating system's page cache, so most reads never touch the disk. Kafka doesn't force each note onto the disk; by default it leaves flushing to the operating system and relies on copies in other buildings for safety.",
        tags: ["Real term: log", "Real term: page cache", "Real term: leader and follower replicas"] },
      { level: 4, kind: "panel", art: "zeroCopy", headline: "Straight from shelf to window",
        text: "When a reader fetches, Kafka can hand notes from the page cache straight to the network (zero-copy, via the operating system's sendfile) without copying them through the program. With TLS this shortcut isn't possible, because the bytes must be encrypted first, so encrypted clusters use more CPU. A topic's compression.type defaults to {{NUMBERS.topicDefaults.compression.type}}: the broker keeps the sender's compressed batches as they are.",
        tags: ["Real term: zero-copy", "Real term: TLS", "Real setting: compression.type"] },
      { level: 4, kind: "text", headline: "The five-part answer",
        text: "Asked “why is Kafka fast?”, name five things: sequential appends, the page cache, zero-copy, batching with compression end to end, and parallelism across partitions. Then name the cost of each: page cache needs memory, zero-copy is lost with TLS, batching adds a few milliseconds, and more partitions mean more overhead and slower recovery.",
        tags: ["Real term: partition", "Real setting: batch.size"] },
      { level: 4, kind: "realSettings", realSettings: [
        { name: "linger.ms", value: "default `{{NUMBERS.kafkaDefaults.linger.ms}}`", why: "batching: VOLUME ↑" },
        { name: "batch.size", value: "default `{{NUMBERS.kafkaDefaults.batch.size}}`", why: "bigger batches, fewer requests" },
        { name: "compression.type", value: "producer default `{{NUMBERS.kafkaDefaults.compression.type}}`; topic default `{{NUMBERS.topicDefaults.compression.type}}`", why: "keep the sender's compression" }
      ] }
    ]
  },
  {
    id: "p41-inside-a-partition", part: 7, title: "Inside a partition",
    blocks: [
      { level: 4, kind: "panel", art: "segments", headline: "A column is a row of binders",
        text: "Each column is stored as a series of files called segments. New notes go into the active segment; a new one starts when it reaches log.segment.bytes ({{NUMBERS.kafkaDefaults.log.segment.bytes}} bytes, 1 GiB) or gets {{NUMBERS.kafkaDefaults.log.roll.hours}} hours old. Small indexes map offsets and timestamps to positions, so a reader can jump straight to a note or a time. Retention deletes whole closed segments, never the active one.",
        tags: ["Real term: log segment", "Real setting: log.segment.bytes", "Real setting: log.roll.hours", "Real term: retention"] },
      { level: 4, kind: "panel", art: "hwLeo", headline: "Two lines on every column",
        text: "The log end offset (LEO) is where a copy's next note will go. The high watermark is the last point every in-sync copy has reached; readers only see notes before it, so they never read a note that could vanish in a failover. With transactions, read_committed readers stop even earlier, at the last stable offset.",
        tags: ["Real term: high watermark", "Real term: log end offset (LEO)", "Real term: in-sync replicas (ISR)", "Real setting: isolation.level"] },
      { level: 4, kind: "panel", art: "leaderEpoch", headline: "Numbered terms after a failover",
        text: "Each new leader starts a numbered term, the leader epoch. A copy returning after a failover asks the new leader where its term began, and cuts off anything it wrote that the new leader never had. This keeps every copy identical and fixed subtle data-loss cases that truncating by high watermark alone used to cause (KIP-101).",
        tags: ["Real term: leader epoch", "Real term: leader and follower replicas"] },
      { level: 4, kind: "panel", art: "tombstone", headline: "Deleting on a latest-note board",
        text: "On a compacted board, a note with a key and an empty value is a tombstone: “delete this key”. The cleaner keeps the latest note per key, then removes tombstones after delete.retention.ms ({{NUMBERS.kafkaDefaults.delete.retention.ms}} ms, one day), giving readers time to see the delete. The active segment is never cleaned, and cleaning starts once enough of the log is untidy (min.cleanable.dirty.ratio, {{NUMBERS.kafkaDefaults.min.cleanable.dirty.ratio}}).",
        tags: ["Real term: tombstone", "Real setting: delete.retention.ms", "Real setting: min.cleanable.dirty.ratio", "Real term: log compaction"] },
      { level: 4, kind: "realSettings", realSettings: [
        { name: "log.segment.bytes", value: "default `{{NUMBERS.kafkaDefaults.log.segment.bytes}}`", why: "smaller segments: finer-grained deletes, more files" },
        { name: "log.roll.hours", value: "default `{{NUMBERS.kafkaDefaults.log.roll.hours}}`", why: "rolls quiet topics so retention can act" },
        { name: "delete.retention.ms", value: "default `{{NUMBERS.kafkaDefaults.delete.retention.ms}}`", why: "how long deletes stay visible" },
        { name: "min.cleanable.dirty.ratio", value: "default `{{NUMBERS.kafkaDefaults.min.cleanable.dirty.ratio}}`", why: "cleaning frequency vs work" },
        { name: "cleanup.policy", value: "default `{{NUMBERS.topicDefaults.cleanup.policy}}`", why: "delete, compact, or both" }
      ] }
    ]
  },
  {
    id: "p42-offsets", part: 7, title: "Where bookmarks live",
    blocks: [
      { level: 4, kind: "panel", art: "offsetsLedger", headline: "The bookmark ledger",
        text: "Bookmarks live in Kafka itself, on an internal compacted topic called __consumer_offsets ({{NUMBERS.kafkaDefaults.offsets.topic.num.partitions}} partitions by default). Each group has a coordinator, a broker, that records its commits there. A committed offset means “the next note I will read”, not “the last one I read”. Lag for a column is its end offset minus the committed offset.",
        tags: ["Real term: __consumer_offsets", "Real term: offset", "Real term: consumer lag"] },
      { level: 4, kind: "panel", art: "offsetReset", headline: "A new team with no bookmark",
        text: "A new group, or one whose bookmark points at notes already cleared, has no valid starting point. auto.offset.reset decides: latest (the default) reads only new notes; earliest starts from the oldest note still kept; by_duration starts a set time back; none throws an error so a person decides. Careful: with latest, notes landing in newly added partitions before the group notices them can be skipped.",
        tags: ["Real setting: auto.offset.reset", "Real term: retention"] },
      { level: 4, kind: "text", headline: "Moving bookmarks on purpose",
        text: "To replay, stop the group and reset its offsets with the kafka-consumer-groups tool: to the earliest note, to a date and time, or shifted back a number of notes. In code, a consumer can seek() to any offset. An empty group's offsets expire after offsets.retention.minutes ({{NUMBERS.kafkaDefaults.offsets.retention.minutes}} minutes, 7 days), and replay never reaches beyond retention.",
        tags: ["Real setting: offsets.retention.minutes", "Real setting: retention.ms"] },
      { level: 4, kind: "realSettings", realSettings: [
        { name: "auto.offset.reset", value: "default `{{NUMBERS.kafkaDefaults.auto.offset.reset}}`", why: "earliest for new analytics, latest for live alerts" },
        { name: "offsets.retention.minutes", value: "default `{{NUMBERS.kafkaDefaults.offsets.retention.minutes}}`", why: "idle groups lose their bookmarks after this" },
        { name: "enable.auto.commit", value: "default `{{NUMBERS.kafkaDefaults.enable.auto.commit}}`", why: "when the bookmark moves" }
      ] }
    ]
  },
  {
    id: "p43-ordering", part: 7, title: "Ordering and the partitioner",
    blocks: [
      { level: 4, kind: "panel", art: "partitioner", headline: "The sorting machine",
        text: "With a key, the producer hashes it (murmur2) and takes the result modulo the partition count: same key, same column, as long as the count never changes. With no key, today's clients fill one column's batch and then move on (sticky partitioning), which gives fuller batches than scattering every note. Custom partitioners exist, but a well-chosen key is usually enough.",
        tags: ["Real term: partitioner", "Real term: key", "Real term: partition"] },
      { level: 4, kind: "panel", art: "inFlight", className: "", headline: "Envelopes on the road",
        text: "A sender may have up to max.in.flight.requests.per.connection unacknowledged requests per connection (default {{NUMBERS.kafkaDefaults.max.in.flight.requests.per.connection}}). Without idempotence, if the first fails and is retried after the second succeeds, they land out of order. With enable.idempotence, sequence numbers let the broker keep order with up to 5 in flight. retries is effectively unlimited; delivery.timeout.ms (two minutes) is the real deadline.",
        tags: ["Real setting: max.in.flight.requests.per.connection", "Real setting: enable.idempotence", "Real setting: delivery.timeout.ms", "Real setting: retries"] },
      { level: 4, kind: "text", headline: "Ordering in one sentence",
        text: "Kafka guarantees order within a partition only, in the order the broker appends. Need order across keys? Put them under one key and accept a busier column, or reorder downstream by a sequence number or timestamp. And never change the partition count of a keyed topic without a migration plan.",
        tags: ["Real term: key", "Real term: hot partition"] },
      { level: 4, kind: "realSettings", realSettings: [
        { name: "max.in.flight.requests.per.connection", value: "default `{{NUMBERS.kafkaDefaults.max.in.flight.requests.per.connection}}`", why: "≤ 5 keeps order with idempotence" },
        { name: "enable.idempotence", value: "default `{{NUMBERS.kafkaDefaults.enable.idempotence}}`", why: "ordered, de-duplicated retries" },
        { name: "delivery.timeout.ms", value: "default `{{NUMBERS.kafkaDefaults.delivery.timeout.ms}}`", why: "total time to keep trying" },
        { name: "retries", value: "default `{{NUMBERS.kafkaDefaults.retries}}`", why: "bounded by delivery.timeout.ms" }
      ] }
    ]
  },
  {
    id: "p44-kraft", part: 7, title: "KRaft: the town council",
    blocks: [
      { level: 4, kind: "panel", art: "townCouncil", headline: "Who keeps the town's records",
        text: "The cluster's own records (which topics exist, which broker leads each column, who is in sync) live in a metadata log called __cluster_metadata. A small council of controllers keeps it and agrees on changes using the Raft protocol: that's KRaft. Brokers follow the log. Since Kafka 4.0 this is the only mode; ZooKeeper is gone.",
        tags: ["Real term: KRaft", "Real term: controller"] },
      { level: 4, kind: "panel", art: "quorum", headline: "A majority must agree",
        text: "The council needs a majority: 3 controllers survive 1 failure, 5 survive 2. One active controller makes decisions such as electing new leaders; the others keep copies of the log and can take over quickly. process.roles sets whether a node is a broker, a controller, or both; run them separately in production, combined only for development.",
        tags: ["Real term: controller", "Real setting: process.roles"] },
      { level: 4, kind: "text", headline: "“A broker dies. What happens?”",
        text: "The active controller notices the broker is gone, picks new leaders for its partitions from the in-sync copies, and writes the change to the metadata log. Brokers and clients pick up the new leaders and carry on. Writes needing acks=all keep working as long as min.insync.replicas copies remain in sync.",
        tags: ["Real term: in-sync replicas (ISR)", "Real setting: min.insync.replicas"] },
      { level: 4, kind: "realSettings", realSettings: [
        { name: "process.roles", value: "broker, controller, or both", why: "separate roles in production" },
        { name: "KRaft", term: true, value: "the only mode since Kafka 4.0", why: "no ZooKeeper to run" }
      ] }
    ]
  },
  {
    id: "p45-streams-connect", part: 7, title: "Kafka Streams and Kafka Connect",
    blocks: [
      { level: 4, kind: "panel", art: "streamsClerk", headline: "The clerk and the notebook",
        text: "Kafka Streams is a Java library, part of Apache Kafka, that runs inside your own app. A KStream is every note; a KTable is the latest value per key. Stateful steps (counts, joins, windows) keep local state stores, backed up to changelog topics so a restarted instance rebuilds them. Work splits into tasks, one per input partition, so partitions cap parallelism here too.",
        tags: ["Real term: Kafka Streams", "Real term: KStream and KTable", "Real term: state store"] },
      { level: 4, kind: "text", headline: "Streams details interviewers like",
        text: "Windows: tumbling (fixed, no overlap), hopping (fixed, overlapping), sliding, and session (ends after a quiet gap). Changing the key writes through an internal repartition topic. processing.guarantee=exactly_once_v2 uses transactions for read-process-write. Standby replicas keep warm copies of state for faster failover.",
        tags: ["Real setting: processing.guarantee", "Real term: state store"] },
      { level: 4, kind: "panel", art: "connectVan", headline: "Vans in and out",
        text: "Kafka Connect runs connectors on workers. Source connectors pin notes from databases or files; sink connectors deliver notes to stores such as a data lake. Converters turn notes into bytes (JSON, or Avro with a schema registry); single message transforms make small per-note edits. In distributed mode, workers share tasks and keep configs, offsets and status in internal topics.",
        tags: ["Real term: Kafka Connect", "Real term: converter", "Real term: single message transform (SMT)"] },
      { level: 4, kind: "text", headline: "When a van meets a bad note",
        text: "By default a connector stops at the first bad record. For sink connectors, errors.tolerance=all with errors.deadletterqueue.topic.name sends bad notes to a dead-letter topic and keeps going. Watch connector lag like any consumer's, and give the dead-letter topic an owner.",
        tags: ["Real setting: errors.tolerance", "Real term: dead-letter topic", "Real term: consumer lag"] },
      { level: 4, kind: "realSettings", realSettings: [
        { name: "processing.guarantee", value: "at_least_once (default) or exactly_once_v2", why: "SAFETY ↑ with transactions" },
        { name: "errors.tolerance", value: "none (default) or all", why: "stop, or skip to a dead-letter topic" }
      ] }
    ]
  },
  {
    id: "p46-interview-questions", part: 7, title: "30 interview questions",
    blocks: [
      { level: 4, kind: "text", headline: "How to answer any Kafka question",
        text: "Answer in four beats: the requirement (what must not go wrong), the mechanism (what Kafka does), the trade-off (which corner of the triangle it pulls towards, and the cost), and how you would check it (a metric or a load test). Use one running story as your example: concrete answers stick." },
      { level: 4, kind: "qa", headline: "Think first, then open the answer",
        items: [
          { q: "What is Kafka, in one sentence?", a: "A distributed, replicated, append-only log: producers write events to partitioned topics, and any number of consumer groups read them independently, in order per partition, and can replay them.", page: "p04-meet-the-board" },
          { q: "Topic, partition, offset: what's the difference?", a: "A topic is a named stream. It is split into partitions for parallelism. An offset is a record's position inside one partition. Ordering exists only within a partition.", page: "p07-columns-and-keys" },
          { q: "How does Kafka guarantee ordering?", a: "Per partition only. The same key always maps to the same partition while the count is unchanged. Idempotent producers keep order through retries with up to 5 requests in flight. Adding partitions remaps keys.", page: "p43-ordering" },
          { q: "How do consumer groups scale?", a: "Each partition is read by one consumer per group, so the partition count caps parallelism and extra consumers sit idle. For queue-style work, share groups let more consumers than partitions take individual records.", page: "p08-teams-of-readers" },
          { q: "What happens in a rebalance?", a: "When consumers join, leave or exceed max.poll.interval.ms, partitions are reassigned. Affected partitions pause and uncommitted work may be redone. The newer consumer protocol (KIP-848, group.protocol=consumer) makes this incremental and broker-coordinated.", page: "p21-consumer" },
          { q: "Explain acks=0, 1 and all.", a: "0: no wait; can lose data. 1: the leader has it; lost if the leader dies before followers copy it. all: every in-sync replica has it, and it's only strong when min.insync.replicas is at least 2.", page: "p19-producer" },
          { q: "What is the ISR?", a: "The in-sync replicas: copies that have kept up with the leader within replica.lag.time.max.ms (30 seconds by default). acks=all waits for them, and a clean leader election picks from them.", page: "p09-never-losing-notes" },
          { q: "Replication factor 3, min.insync.replicas 2, acks=all. What survives?", a: "Lose one broker: writes continue. Lose two: acks=all writes to affected partitions fail with NotEnoughReplicas until a copy returns; nothing acknowledged is lost.", page: "p20-durability" },
          { q: "What is unclean leader election?", a: "Letting an out-of-sync replica become leader when no in-sync one is left. You regain availability but lose the records it missed. It is off by default.", page: "p20-durability" },
          { q: "How does the idempotent producer work?", a: "The broker gives the producer an ID; each batch carries a per-partition sequence number, so duplicates and gaps are detected. It covers retries within one producer session and is on by default since Kafka 3.0.", page: "p19-producer" },
          { q: "How does exactly-once work?", a: "Transactions with a transactional.id: writes to many partitions plus the consumer's offsets commit atomically; an epoch fences zombie producers; read_committed consumers skip aborted data. It covers Kafka-to-Kafka work only; external side effects need idempotency.", page: "p21-consumer" },
          { q: "At-least-once vs at-most-once in code?", a: "Commit after processing for at-least-once (then dedupe), or before processing for at-most-once. Auto-commit with asynchronous processing can silently skip records.", page: "p21-consumer" },
          { q: "What is consumer lag, and how do you fix it?", a: "The log end offset minus the committed offset, per partition. Fixes: faster handlers, more partitions and consumers, fewer records per poll, fixing hot keys, or scaling the downstream system.", page: "p23-is-it-healthy" },
          { q: "How many partitions should a topic have?", a: "Peak throughput divided by measured per-partition throughput, on both the producer and consumer side; take the larger and add headroom. Slow readers often decide it: in our pizza estimate, 37 minimum, 48 chosen.", page: "p22-how-many-columns" },
          { q: "Can you reduce a topic's partitions?", a: "No, you can only add them, and adding remaps keys. To shrink or reshape, create a new topic and migrate producers and consumers.", page: "p22-how-many-columns" },
          { q: "Retention vs compaction?", a: "Retention deletes old segments by time or size; compaction keeps the latest record per key, with tombstones for deletes. cleanup.policy can combine both. Compaction suits state and changelogs; retention suits event history.", page: "p10-how-long-notes-stay" },
          { q: "Why is Kafka fast?", a: "Sequential appends, the OS page cache, zero-copy transfers, batching and compression end to end, and parallelism across partitions.", page: "p40-why-kafka-is-fast" },
          { q: "What is the high watermark?", a: "The offset up to which all in-sync replicas have the data. Consumers read only below it, so they never see records that could be lost in a failover.", page: "p41-inside-a-partition" },
          { q: "Where are consumer offsets stored?", a: "In the internal compacted __consumer_offsets topic, written by each group's coordinator broker. A committed offset is the next record to read.", page: "p42-offsets" },
          { q: "What does auto.offset.reset do?", a: "It applies when a group has no valid committed offset: latest (the default), earliest, by_duration or none. A classic bug: a new group on latest silently skips history, or idle groups lose offsets after offsets.retention.minutes.", page: "p42-offsets" },
          { q: "What is KRaft, and why was ZooKeeper removed?", a: "Kafka's built-in Raft quorum of controllers keeps cluster metadata in its own log. It removes a second system to operate, speeds up failover, and supports many more partitions. Since 4.0 it is the only mode.", page: "p44-kraft" },
          { q: "Kafka or RabbitMQ?", a: "Kafka: a durable, replayable log with many independent readers, per-partition order and high throughput. RabbitMQ: broker-side routing and per-message acknowledgement and removal, great for task queues. Decide by replay and fan-out needs; share groups narrow the gap.", page: "p33-should-it-be-kafka" },
          { q: "How do you handle a poison message?", a: "Catch errors per record, retry with back-off, then send it to a dead-letter topic with context. Alert on it and give it an owner. Never block a partition forever; validate schemas at the producer.", page: "p37-what-if" },
          { q: "What is the transactional outbox, and why not dual writes?", a: "Write the business change and an outbox row in one database transaction; a relay (often CDC) publishes the row. Dual writes to the database and Kafka can disagree after a crash.", page: "p35-patterns" },
          { q: "How do you send very large messages?", a: "Limits are about 1 MB by default (message.max.bytes, max.message.bytes, max.request.size). Prefer storing the payload in object storage and sending a reference (a claim check); raising limits costs memory and latency.", page: "p46-interview-questions" },
          { q: "How do you run Kafka across regions?", a: "MirrorMaker 2 replicates topics asynchronously and can translate consumer offsets. Active-passive is simpler; active-active needs loop prevention and conflict handling. Because replication is asynchronous, the RPO is above zero: say so.", page: "p37-what-if" },
          { q: "How do you cut cross-zone network cost?", a: "Rack awareness: set broker.rack so copies spread across zones, and with client.rack plus a replica selector on the brokers, consumers fetch from the nearest copy (KIP-392).", page: "p38-security-cost-ops" },
          { q: "How do you evolve schemas safely?", a: "Use a schema registry with a compatibility mode. Backward: upgrade consumers first. Forward: upgrade producers first. Add optional fields with defaults; put breaking changes on a new topic.", page: "p36-data-contracts" },
          { q: "How would you monitor a Kafka cluster?", a: "Consumer lag; under-replicated and offline partitions; ISR shrink and expand rates; request latency; disk and network; rebalance rate; and that exactly one controller is active. Each alert needs an owner.", page: "p23-is-it-healthy" },
          { q: "“Design an order pipeline with Kafka.” Where do you start?", a: "Walk the six steps: requirements, estimate, architecture, data design, failure modes, operate and evolve. Lead with what must not go wrong, size it with numbers, and keep “don't use Kafka” on the table.", page: "p39-design-exercise" }
        ] },
      { level: 4, kind: "realSettings", realSettings: [
        { name: "message.max.bytes", value: "default `{{NUMBERS.kafkaDefaults.message.max.bytes}}`", why: "about 1 MB per batch" },
        { name: "replica.lag.time.max.ms", value: "default `{{NUMBERS.kafkaDefaults.replica.lag.time.max.ms}}`", why: "when a copy drops out of sync" },
        { name: "broker.rack", value: "not set by default", why: "spread copies across zones" },
        { name: "group.protocol", value: "default `{{NUMBERS.kafkaDefaults.group.protocol}}`; `consumer` is the newer protocol", why: "calmer rebalances" }
      ] }
    ]
  },

];

/* ---------------------------------------------------------------------
   DRAWING HELPERS for ART functions (all return SVG strings)
   --------------------------------------------------------------------- */
let artUid = 0;
function artSvg({ w, h, title, desc, body, cls = "" }) {
  const id = "art" + (++artUid);
  return `<svg class="art ${cls}${w <= 400 ? " art-small" : ""}" viewBox="0 0 ${w} ${h}" role="img" aria-labelledby="${id}-t ${id}-d" focusable="false">` +
    `<title id="${id}-t">${esc(title)}</title><desc id="${id}-d">${esc(desc)}</desc>${body}</svg>`;
}
function u(sym, x, y, w, h, extra = "") {
  const vb = SYMBOL_VB[sym] || [w, h];
  return `<use href="#${sym}" x="${x}" y="${y}" width="${w == null ? vb[0] : w}" height="${h == null ? vb[1] : h}" ${extra}/>`;
}
/* A character: ch("reader", x, y, scale, "sleepy", { flip: true }) */
function ch(name, x, y, s = 1, face = "happy", o = {}) {
  const c = CAST[name];
  const t = o.flip ? `translate(${x + c.w * s} ${y}) scale(${-s} ${s})` : `translate(${x} ${y}) scale(${s})`;
  let inner = `<use href="#${c.sym}" width="${c.w}" height="${c.h}"/>`;
  if (c.face && face) { const [fx, fy, fw, fh] = c.face; inner += `<use href="#f-${face}" x="${fx}" y="${fy}" width="${fw}" height="${fh}" ${o.faceAttr || ""}/>`; }
  return `<g class="char char-${name}" transform="${t}"><g filter="url(#wobble)">${inner}</g></g>`;
}
function txt(x, y, s, o = {}) {
  return `<text x="${x}" y="${y}" class="${o.cls || "svg-hand"}" font-size="${o.size || 18}" text-anchor="${o.anchor || "middle"}"${o.fill ? ` style="fill:${o.fill}"` : ""}${o.attr ? " " + o.attr : ""}>${esc(s)}</text>`;
}
function arrow(d, o = {}) {
  const alert = o.alert ? "-alert" : "";
  return `<path d="${d}" ${stl("none", o.alert ? "var(--alert)" : (o.color || "var(--ink)"), o.w || 2.2, o.dash ? "stroke-dasharray:6 5;" : "")} marker-end="url(#arrowhead${alert})"/>`;
}
/* A written sticky note with 1–3 lines of text */
function noteRect(x, y, w, h, lines, o = {}) {
  x = +x; y = +y; w = +w; h = +h;
  const size = o.size || 13, lh = size * 1.05, cx = x + w / 2;
  const y0 = y + h / 2 - ((lines.length - 1) * lh) / 2 + size * 0.35;
  const t = lines.map((l, i) => `<text x="${cx}" y="${(y0 + i * lh).toFixed(1)}" class="svg-note" font-size="${size}" text-anchor="middle">${esc(l)}</text>`).join("");
  return `<g${o.rot ? ` transform="rotate(${o.rot} ${cx} ${y + h / 2})"` : ""}${o.opacity != null ? ` style="opacity:${o.opacity}"` : ""}><rect x="${x}" y="${y}" width="${w}" height="${h}" ${stl("var(--note)", "var(--ink)", 1.5)}/>${t}</g>`;
}
/* A notice board with an optional label card. Returns geometry so notes can be placed in columns. */
function board(x, y, s, label, o = {}) {
  const cols = o.columns !== false, W = 200 * s, H = 150 * s;
  let svg = u(cols ? "p-board" : "p-board-plain", x, y, W, H);
  if (label) {
    const lw = Math.max(80, label.length * 13 + 24), cx = x + W / 2;
    svg += `<rect data-rough data-fill-style="solid" x="${(cx - lw / 2).toFixed(1)}" y="${y - 18}" width="${lw}" height="30" rx="3" ${stl("var(--card)", "var(--ink)", 2)}/>` +
      `<text x="${cx}" y="${y + 3}" class="svg-hand" font-size="20" text-anchor="middle">${esc(label)}</text>`;
  }
  return { svg, cols: [29.5, 76.5, 123.5, 170.5].map((c) => x + c * s), top: y + 6 * s, bottom: y + 122 * s, left: x + 6 * s, right: x + 194 * s, width: W, height: H };
}

/* ---------------------------------------------------------------------
   ROUGH.JS — hand-drawn strokes when the library loads; plain SVG/CSS otherwise.
   --------------------------------------------------------------------- */
const ROUGH_STROKE = "#010101", ROUGH_FILL = "#020202";
function hashSeed(str) { let h = 7; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return (h % 2000) + 1; }
function recolor(node, strokeCss, fillCss) {
  node.querySelectorAll("path").forEach((p) => {
    const s = p.getAttribute("stroke"), f = p.getAttribute("fill");
    if (s === ROUGH_STROKE) { p.removeAttribute("stroke"); p.style.stroke = strokeCss; }
    else if (s === ROUGH_FILL) { p.removeAttribute("stroke"); p.style.stroke = fillCss; }
    if (f === ROUGH_FILL) { p.removeAttribute("fill"); p.style.fill = fillCss; }
    else if (f === ROUGH_STROKE) { p.removeAttribute("fill"); p.style.fill = strokeCss; }
  });
}
/* Inside drawings: any shape with data-rough is redrawn by Rough.js, keeping its CSS-variable colors. */
function roughenSvg(svg) {
  if (!window.rough || svg.dataset.roughDone) return;
  svg.dataset.roughDone = "1";
  const items = svg.querySelectorAll("[data-rough]");
  if (!items.length) return;
  const rs = window.rough.svg(svg);
  const base = hashSeed((svg.querySelector("title") || {}).textContent || "art");
  items.forEach((el, i) => {
    try {
      const a = (n) => parseFloat(el.getAttribute(n));
      const strokeCss = el.style.stroke || "var(--ink)";
      const fillCss = el.style.fill && el.style.fill !== "none" ? el.style.fill : null;
      const o = { roughness: SETTINGS.rough.roughness, bowing: SETTINGS.rough.bowing, strokeWidth: parseFloat(el.style.strokeWidth) || 2, stroke: ROUGH_STROKE, seed: base + i };
      if (fillCss) { o.fill = ROUGH_FILL; o.fillStyle = el.dataset.fillStyle || "hachure"; o.hachureGap = SETTINGS.rough.hachureGap; o.fillWeight = 1.2; }
      const tag = el.tagName.toLowerCase();
      let node = null;
      if (tag === "rect") node = rs.rectangle(a("x"), a("y"), a("width"), a("height"), o);
      else if (tag === "circle") node = rs.circle(a("cx"), a("cy"), a("r") * 2, o);
      else if (tag === "ellipse") node = rs.ellipse(a("cx"), a("cy"), a("rx") * 2, a("ry") * 2, o);
      else if (tag === "line") node = rs.line(a("x1"), a("y1"), a("x2"), a("y2"), o);
      else if (tag === "path") node = rs.path(el.getAttribute("d"), o);
      if (!node) return;
      recolor(node, strokeCss, fillCss);
      if (el.getAttribute("transform")) node.setAttribute("transform", el.getAttribute("transform"));
      node.setAttribute("class", "rough");
      el.replaceWith(node);
    } catch (e) { /* keep the plain shape */ }
  });
}
/* Around HTML boxes: an outline overlay that follows the box size. */
function drawRoughBox(el) {
  if (!window.rough) return;
  const w = el.offsetWidth, h = el.offsetHeight;
  if (w < 4 || h < 4 || (el._rw === w && el._rh === h)) return;
  el._rw = w; el._rh = h;
  let svg = el.querySelector(":scope > svg.rough-overlay");
  if (!svg) {
    svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "rough-overlay");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    el.prepend(svg);

  $("#g-search").addEventListener("input", (e) => filterGlossary(e.target.value));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $(".drawer.open")) { e.preventDefault(); closeDrawers(); } });
  document.addEventListener("click", (e) => {
    const tag = e.target.closest("[data-g]");
    if (tag) { e.preventDefault(); openGlossary(tag.dataset.g, tag); return; }
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const id = decodeURIComponent(a.getAttribute("href").slice(1));
    const el = id && document.getElementById(id);
    if (!el || !$("#main").contains(el)) return;
    if (a.closest(".drawer")) closeDrawers(false);
    ensureVisible(el);
    if (location.hash === "#" + id) { e.preventDefault(); el.scrollIntoView({ block: "start" }); focusTarget(el); }
  });
  window.addEventListener("hashchange", () => goToHash(false));
  window.addEventListener("scroll", updateProgress, { passive: true });
  window.addEventListener("resize", () => { updateProgress(); measureHeader(); markScrollers(); });
  if (window.ResizeObserver) new ResizeObserver(measureHeader).observe($("#topbar"));
}

/* ---------------------------------------------------------------------
   AUDIT — open the file with ?audit to list problems in the console.
   --------------------------------------------------------------------- */
function audit() {
  const issues = [];
  const seen = new Set();
  PAGES.forEach((p) => {
    if (seen.has(p.id)) issues.push(`Duplicate page id: ${p.id}`);
    seen.add(p.id);
    if (!PLAN_BY_ID.has(p.id)) issues.push(`Page id not in PAGE_PLAN: ${p.id}`);
    if (p.id !== "p01-cover" && countWords(p.title) > SETTINGS.headlineMaxWords) issues.push(`${p.id}: headline over ${SETTINGS.headlineMaxWords} words`);
    (p.blocks || []).forEach((b, i) => {
      const t = b.body ?? b.text, lim = SETTINGS.wordLimits[b.level];
      if (t && !b.noLimit && countWords(t) > lim) issues.push(`${p.id} block ${i + 1}: ${countWords(t)} words (limit ${lim})`);
      if (b.headline && countWords(b.headline) > SETTINGS.headlineMaxWords) issues.push(`${p.id} block ${i + 1}: headline too long`);
      (b.panels || []).forEach((pn, k) => { if (countWords(pn.text) > lim) issues.push(`${p.id} block ${i + 1} panel ${k + 1}: ${countWords(pn.text)} words (limit ${lim})`); });
      if (b.kind === "hood" && COMPANY_FACTS[p.company]) { const n = countWords(b.text) + countWords(COMPANY_FACTS[p.company].lesson.text); if (n > lim) issues.push(`${p.id} under the hood: ${n} words with the lesson (limit ${lim})`); }
      if (b.kind === "lens" && COMPANY_FACTS[p.company]) { const n = countWords(b.whatIf) + countWords(COMPANY_FACTS[p.company].lens); if (n > lim) issues.push(`${p.id} lens: ${n} words (limit ${lim})`); }
      if (b.card) ["need", "mustNot", "giveUp"].concat(b.card.challenges.map((_, j) => "challenges." + j)).forEach((f) => {
        const t = f.includes(".") ? b.card.challenges[+f.split(".")[1]] : b.card[f];
        if (countWords(t) > lim) issues.push(`${p.id} card ${f}: ${countWords(t)} words (limit ${lim})`);
      });
      (b.cards || []).forEach((c) => { const n = countWords(c.front) + countWords(c.breaks) + countWords(c.fix) + countWords(c.corner); if (n > lim) issues.push(`${p.id} flip card ${c.id}: ${n} words (limit ${lim})`); if (!ART[c.art]) issues.push(`${p.id} flip card ${c.id}: missing drawing`); });
      (b.items || []).forEach((it, j) => { const n = countWords(it.q) + countWords(it.a); if (n > lim) issues.push(`${p.id} question ${j + 1}: ${n} words (limit ${lim})`); if (it.page && !PLAN_BY_ID.has(it.page)) issues.push(`${p.id} question ${j + 1}: unknown page`); });
      (b.cells || []).forEach((c) => { const n = countWords(c.title) + countWords(c.happens) + countWords(c.protects) + countWords(c.design); if (n > lim) issues.push(`${p.id} cell ${c.id}: ${n} words (limit ${lim})`); });
      (b.questions || []).forEach((q, j) => { const n = countWords(q.q) + q.options.reduce((a, o) => a + countWords(o), 0) + countWords(q.why); if (n > lim) issues.push(`${p.id} quiz ${j + 1}: ${n} words (limit ${lim})`); });
      if (b.tree) Object.entries(b.tree.nodes).forEach(([k, n]) => { const t = (n.q || "") + " " + (n.why || ""); if (countWords(t) > lim) issues.push(`${p.id} tree ${k}: too long`); });
      if (b.decision) { const n = countWords(b.decision.chose) + countWords(b.decision.rejected) + countWords(b.decision.why); if (n > lim) issues.push(`${p.id} decision: ${n} words (limit ${lim})`); }
      if (b.kind === "reveal") b.steps.forEach((t, j) => { if (countWords(t) > lim) issues.push(`${p.id} reveal step ${j + 1}: too long`); });
      ((b.widget && b.widget.steps) || []).forEach((s, k) => { if (countWords(s.text) > lim) issues.push(`${p.id} block ${i + 1} step ${k}: ${countWords(s.text)} words (limit ${lim})`); });
      if (b.art && !ART[b.art]) issues.push(`${p.id} block ${i + 1}: missing drawing ${b.art}`);
      if (b.level >= 2 && b.kind === "panel" && b.art && !(b.tags || []).length) issues.push(`${p.id} block ${i + 1}: Level 2+ drawing without a Real term tag`);
      (b.tags || []).forEach((tag) => { if (!lookupTag(tag).g) issues.push(`${p.id}: tag not in glossary: ${tag}`); });
      (b.realSettings || []).forEach((s) => { if (!lookupTag((s.term ? "Real term: " : "Real setting: ") + s.name).g) issues.push(`${p.id}: setting not in glossary: ${s.name}`); });
    });
  });
  GLOSSARY.forEach((g) => {
    if (!PLAN_BY_ID.has(g.page)) issues.push(`Glossary ${g.id}: unknown page ${g.page}`);
    if (!SYMBOL_VB[g.icon]) issues.push(`Glossary ${g.id}: unknown icon ${g.icon}`);
  });
  const d = NUMBERS.estimate.derived;
  if (d.minPartitions > NUMBERS.estimate.recommendedPartitions) issues.push("Recommended partitions below the computed minimum");
  if (NUMBERS.storyLayouts.pizza.partitions !== NUMBERS.estimate.recommendedPartitions) issues.push("Pizza partitions differ between page 11 and page 34");
  return issues;
}

/* ---------- Stage 3 · Part 2 drawings ---------- */
/* A wide board with N columns; returns the column centres so notes and readers can line up with them. */
function wideBoard(x0, x1, y0, y1, cols, label, o = {}) {
  const w = x1 - x0, cw = w / cols;
  let s = `<rect x="${x0}" y="${y0}" width="${w}" height="${y1 - y0}" rx="4" data-rough data-fill-style="solid" ${stl("var(--board)", "var(--board-edge)", o.edge || 6)}/>`;
  for (let i = 1; i < cols; i++) {
    const x = (x0 + i * cw).toFixed(1);
    s += `<line x1="${x}" y1="${y0 + 7}" x2="${x}" y2="${y1 - 7}" ${stl("none", "var(--board-edge)", o.thin ? 1.1 : 2, o.thin ? "" : "stroke-dasharray:5 5;")}/>`;
  }
  if (label) {
    const lw = Math.max(70, label.length * (o.mono ? 9.6 : 12.5) + 22), cx = (x0 + x1) / 2;
    s += `<rect x="${(cx - lw / 2).toFixed(1)}" y="${y0 - 16}" width="${lw.toFixed(1)}" height="28" rx="3" ${solidCard()}/>` +
      txt(cx, y0 + 4, label, { size: o.mono ? 14 : 18, cls: o.mono ? "svg-mono" : "svg-hand" });
  }
  return { svg: s, cw, centers: Array.from({ length: cols }, (_, i) => x0 + cw * (i + 0.5)) };
}
/* A building: roof + walls. */
function house(x, w, top = 50, eave = 100, base = 245) {
  return `<path d="M${x - 10} ${eave} L${x + w / 2} ${top} L${x + w + 10} ${eave} Z" ${solidCard()}/><rect x="${x}" y="${eave}" width="${w}" height="${base - eave}" ${solidCard()}/>`;
}
/* A small board holding n notes; copy:true draws it as a dashed photocopy. */
function miniBoard(x, y, n, o = {}) {
  let s = `<rect x="${x}" y="${y}" width="120" height="84" rx="3" ${stl("var(--board)", "var(--board-edge)", 4, o.copy ? "stroke-dasharray:7 5;" : "")}/>`;
  for (let i = 0; i < n; i++) s += u("p-sticky", x + 12 + (i % 3) * 35, y + 10 + Math.floor(i / 3) * 36, 26, 26);
  return s;
}
const crown = (x, y) => `<path d="M${x} ${y + 16} L${x + 4} ${y} L${x + 12} ${y + 10} L${x + 18} ${y - 4} L${x + 24} ${y + 10} L${x + 32} ${y} L${x + 36} ${y + 16} Z" ${stl("var(--note)", "var(--ink)", 2)}/>`;
const cross = (x, y, r = 12) => `<path d="M${x - r} ${y - r} L${x + r} ${y + r} M${x + r} ${y - r} L${x - r} ${y + r}" ${stl("none", "var(--alert)", 4)}/>`;
function waves(x, y, n, rows = 2) {
  let s = "";
  for (let r = 0; r < rows; r++) { let d = `M${x} ${y + r * 10}`; for (let i = 0; i < n; i++) d += " q10 -7 20 0"; s += `<path d="${d}" ${stl("none", "var(--alert)", 2.4)}/>`; }
  return s;
}

const TRI = { V: [160, 40], F: [58, 196], S: [262, 196] };
function triXY(w) {
  const t = w[0] + w[1] + w[2] || 1;
  return [0, 1].map((k) => (w[0] * TRI.V[k] + w[1] * TRI.F[k] + w[2] * TRI.S[k]) / t);
}
function triangleArt(points, o = {}) {
  const [cV, cF, cS] = SETTINGS.triangle.corners;

  (points || []).forEach((pt) => {
    const [x, y] = triXY(pt.w), pos = pt.pos || (x > 190 ? "left" : "right");
    const at = { left: [x - 12, y + 5, "end"], right: [x + 12, y + 5, "start"], above: [x, y - 13, "middle"], below: [x, y + 22, "middle"] }[pos];

/* "Pick your stop" (page 2): one button per included level; pressing it sets the level filter. */
registerBlock("stops", (b) => {
  const items = SETTINGS.levels.map((l) =>
    `<li><button type="button" class="stop lv-${l}" data-set-level="${l}" aria-pressed="false">` +
    `<span class="stop-n" aria-hidden="true">${l}</span><span class="stop-name">Level ${l} · ${esc(SETTINGS.levelNames[l])}</span>` +
    `<span class="stop-who"><strong>${esc(SETTINGS.levelAudience[l])}.</strong> ${esc(SETTINGS.levelWho[l].replace(/^[^:]+:\s*/, "").replace(/^./, (c) => c.toUpperCase()))}</span></button></li>`).join("");
  return `${bodyText(b)}<ol class="stops">${items}</ol><p class="stops-status" data-stops-status></p>`;
});
onRender((main) => {
  main.addEventListener("click", (e) => {
    const s = e.target.closest("[data-set-level]");
    if (s) applyLevel(+s.dataset.setLevel, { noToast: true });
  });
});
onLevel((L) => {
  $$("[data-set-level]").forEach((s) => s.setAttribute("aria-pressed", String(+s.dataset.setLevel === L)));
  const c = pageCounts();

const DIL = { slots: [180, 290, 400, 510], lanes: [186, 234, 282, 330], hand: "translate(-448px, -11px) scale(.55)", every: 2400 };

  return w.steps.map((s) => {

      note: s.note || cur.note,
      marks: Object.assign({}, cur.marks, s.marks || {}),
      asleep: s.asleep ? s.asleep.slice() : cur.asleep.filter((r) => !(s.wake || []).includes(r)),

}

  let body = `<rect x="125" y="40" width="450" height="106" rx="4" data-rough data-fill-style="solid" ${stl("var(--board)", "var(--board-edge)", 6)}/>` +

  for (let k = 0; k < last; k++) body += noteSvg(k);
  body += `<g class="dil-new at-${first.note}" style="${first.note === "board" ? "" : `transform:${DIL.hand}`}">${noteSvg(last)}</g>`;

    `<div class="dil-controls"><button type="button" class="btn dil-play">▶ Play</button><button type="button" class="btn dil-step">Next step →</button>` +
    `<button type="button" class="btn dil-reset">↺ Start over</button></div><p class="dil-cap" aria-live="polite"></p>` +
    `<ol class="dil-all" start="0">${steps}</ol></div>`;
});
function setupDil(el) {
  const b = WIDGET_DATA.get(el.dataset.dil), w = b.widget, states = dilStates(w), end = states.length - 1;
  const newest = w.notes[w.notes.length - 1].n;
  const play = $(".dil-play", el), stepBtn = $(".dil-step", el), cap = $(".dil-cap", el), note = $(".dil-new", el);
  const wrap = $(".art-wrap", el), art = $("svg", wrap);
  let i = 0, timer = null;
  /* On narrow screens the drawing scrolls sideways: keep whatever just moved in view. */
  function follow(x) {
    if (wrap.scrollWidth <= wrap.clientWidth + 2) return;
    const scale = art.getBoundingClientRect().width / 680;
    const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    wrap.scrollTo({ left: Math.max(0, x * scale - wrap.clientWidth / 2), behavior: smooth ? "smooth" : "auto" });
  }
  function show(k) {
    const prev = states[i];

    const st = states[k];
    if (k === 0) follow(0);
    else if (st.note !== prev.note) follow(st.note === "hand" ? 60 : DIL.slots[DIL.slots.length - 1]);
    else {
      const moved = w.readers.find((r) => st.marks[r.id] !== prev.marks[r.id]);
      if (moved) follow(DIL.slots[Math.max(0, w.notes.findIndex((n) => n.n === st.marks[moved.id]))]);
    }
    note.setAttribute("class", `dil-new at-${st.note}`);
    note.style.transform = st.note === "board" ? "none" : DIL.hand;

      $(`.dil-face[data-r="${r.id}"]`, el).setAttribute("href", st.asleep.includes(r.id) ? "#f-sleepy" : "#f-happy");

    if (i === end) show(0);

    show(i + 1);

  }

  $(".dil-reset", el).addEventListener("click", () => { stop(); show(0); play.textContent = "▶ Play"; });
  window.addEventListener("beforeprint", () => { stop(); show(end); });
  show(0);
}

/* Triangle playground (page 18): the deterministic teaching model from NUMBERS.triangleModel. */
const TPG = { V: [180, 50], F: [66, 276], S: [294, 276] };
const TP_KEYS = ["volume", "freshness", "safety"];
function tpPresets() {
  const d = NUMBERS.kafkaDefaults;
  const p = { defaults: { label: `${SETTINGS.kafkaVersion} defaults`, acks: String(d.acks), linger: d["linger.ms"], compression: d["compression.type"], minIsr: d["min.insync.replicas"] } };
  ["upi", "pizza", "cab", "clicks"].forEach((k) => {
    const c = NUMBERS.configCards[k].preset;
    p[k] = { label: STORIES[k].name, acks: c.acks, linger: c.linger, compression: c.compression, minIsr: c.minIsr, note: NUMBERS.configCards[k].presetNote };
  });
  return p;
}
function tpModel(c) {
  const m = NUMBERS.triangleModel, sc = { volume: 0, freshness: 0, safety: 0 }, rows = [];
  const add = (label, d, note) => { TP_KEYS.forEach((k) => { sc[k] += d[k] || 0; }); rows.push({ label, d, note }); };
  add(`acks=${c.acks}`, m.acks[c.acks]);
  add(`linger.ms=${c.linger}`, { volume: c.linger / m.lingerDivisor, freshness: -c.linger / m.lingerDivisor });
  add(`compression.type=${c.compression}`, m.compression[c.compression]);
  const mi = m.minIsr[c.minIsr], counts = !mi.onlyWithAcksAll || c.acks === "all";
  add(`min.insync.replicas=${c.minIsr}`, counts ? { safety: mi.safety } : {}, counts ? "" : "only counts with acks=all");
  const raw = TP_KEYS.map((k) => sc[k]), lo = Math.min(...raw), shifted = raw.map((v) => v - lo + 1), tot = shifted.reduce((a, b) => a + b, 0);
  const w = shifted.map((v) => v / tot);
  const warn = [];

function setupPlayground(el) {

      ["Peak events per second", fmt(d.peakPerSec), `${fmt(v.ordersPerDay)} × ${fmt(v.eventsPerOrder)} = ${fmt(d.eventsPerDay)} a day; ÷ ${fmt(u.secondsPerDay)} ≈ ${fmt(d.avgPerSec)} a second; × ${fmt(v.peakMultiplier)}`],
      ["Peak MB per second", fmt(d.peakMBps, 2), `${fmt(d.peakPerSec)} × ${fmt(v.avgSizeKB)} KB ÷ ${fmt(u.kbPerMb)}`],
      ["Storage on disk", disk, `${fmt(d.gbPerDay, 2)} GB a day × ${fmt(v.retentionDays)} days × ${fmt(v.replicationFactor)} copies`],
      ["Minimum partitions", fmt(d.minPartitions), `one reader handles 1,000 ÷ ${fmt(v.processingMs)} = ${fmt(d.perConsumerPerSec, 1)} a second; ${fmt(d.peakPerSec)} ÷ ${fmt(d.perConsumerPerSec, 1)}, rounded up`]
    ];
    out.innerHTML = `<dl class="est-res">${rows.map(([k, val, how]) => `<div><dt>${k}</dt><dd><span class="est-v">${val}</span><span class="est-how">${how}</span></dd></div>`).join("")}</dl>` +
      `<p class="est-note">Then add headroom for growth. The average is rounded to a whole number before the peak multiplier, as on the napkin. A planning aid, not a substitute for load-testing.</p>`;
  }
  el.addEventListener("input", calc);
  $(".est-reset", el).addEventListener("click", () => { const i = NUMBERS.estimate.inputs; EST_FIELDS.forEach(([k]) => { el.elements[k].value = i[k]; }); calc(); });
  calc();
}
onRender((main) => $$("[data-est]", main).forEach(setupEstimator));

/* Reference-design reveal (page 39). */
registerBlock("reveal", (b) => {
  const id = widgetId(b);
  return `<div class="rv" data-rv="${id}"><div class="art-wrap">${refDesignSvg()}</div><p class="scroll-hint" aria-hidden="true">↔ Swipe the drawing sideways to see all of it</p>` +
    `<div class="dil-controls"><button type="button" class="btn rv-next">Show step 1 →</button><button type="button" class="btn rv-all">Show all</button><button type="button" class="btn rv-reset">↺ Start over</button></div>` +
    `<ol class="rv-list">${b.steps.map((t, k) => `<li data-step="${k + 1}">${md(t)}</li>`).join("")}</ol><p class="rv-status sr-only" aria-live="polite"></p></div>`;
});
function setupReveal(el) {
  const n = WIDGET_DATA.get(el.dataset.rv).steps.length, next = $(".rv-next", el);
  let k = 0;
  function show(v) {
    k = v;
    $$(".rd-step", el).forEach((g) => g.classList.toggle("on", +g.dataset.step <= k));
    $$(".rv-list li", el).forEach((li) => { li.hidden = +li.dataset.step > k; li.classList.toggle("now", +li.dataset.step === k); });
    next.disabled = k >= n;
    next.textContent = k >= n ? "All steps shown" : `Show step ${k + 1} →`;
    $(".rv-status", el).textContent = k ? `Step ${k} of ${n} shown.` : "";
  }
  next.addEventListener("click", () => show(Math.min(n, k + 1)));
  $(".rv-all", el).addEventListener("click", () => show(n));
  $(".rv-reset", el).addEventListener("click", () => show(0));
  window.addEventListener("beforeprint", () => show(n));
  show(0);
}
onRender((main) => $$("[data-rv]", main).forEach(setupReveal));

/* Six-question quiz with instant feedback (page 39). */
registerBlock("quiz", (b) => {
  const id = widgetId(b);
  return `<div class="quiz" data-quiz="${id}"><ol class="quiz-list">${b.questions.map((q, i) =>
    `<li class="quiz-q" data-q="${i}"><p class="quiz-text" id="${id}-q${i}">${md(q.q)}</p><div class="quiz-opts" role="group" aria-labelledby="${id}-q${i}">` +
    q.options.map((o, j) => `<button type="button" class="quiz-opt${j === q.answer ? " is-answer" : ""}" data-o="${j}">${md(o)}</button>`).join("") +
    `</div><p class="quiz-fb" aria-live="polite"></p><p class="quiz-why"><strong>Why:</strong> ${md(q.why)}</p></li>`).join("")}</ol>` +
    `<p class="quiz-score" aria-live="polite"></p><button type="button" class="btn quiz-reset">↺ Try again</button></div>`;
});
function setupQuiz(el) {
  const qs = WIDGET_DATA.get(el.dataset.quiz).questions, score = $(".quiz-score", el);
  function update() {
    const done = $$(".quiz-q.answered", el), right = done.filter((q) => q.classList.contains("right")).length;
    score.textContent = done.length ? `Score: ${right} of ${done.length} answered${done.length === qs.length ? ` — ${right === qs.length ? "perfect!" : "check the explanations above."}` : "."}` : "";
  }
  el.addEventListener("click", (e) => {
    const btn = e.target.closest(".quiz-opt");
    if (btn) {
      const li = btn.closest(".quiz-q"), q = qs[+li.dataset.q], ok = +btn.dataset.o === q.answer;
      if (li.classList.contains("answered")) return;
      li.classList.add("answered", ok ? "right" : "wrong");
      btn.classList.add("picked");
      $$(".quiz-opt", li).forEach((o) => { o.disabled = true; if (+o.dataset.o === q.answer) o.insertAdjacentHTML("beforeend", ' <span class="quiz-mark">✓ correct answer</span>'); });
      if (!ok) btn.insertAdjacentHTML("beforeend", ' <span class="quiz-mark">✗ your answer</span>');
      $(".quiz-fb", li).textContent = ok ? "Right!" : "Not quite.";
      update();
      return;
    }
    if (e.target.closest(".quiz-reset")) {
      $$(".quiz-q", el).forEach((li) => { li.classList.remove("answered", "right", "wrong"); $(".quiz-fb", li).textContent = ""; });
      $$(".quiz-opt", el).forEach((o) => { o.disabled = false; o.classList.remove("picked"); $$(".quiz-mark", o).forEach((m) => m.remove()); });
      update();
      const first = $(".quiz-opt", el); if (first) first.focus();
    }
  });
}
onRender((main) => $$("[data-quiz]", main).forEach(setupQuiz));

  renderDocFooter();
  wire();
  applyTheme(store.get(SETTINGS.storageKeys.theme) || "auto", false);
  const saved = parseInt(store.get(SETTINGS.storageKeys.level), 10);
  applyLevel(SETTINGS.levels.includes(saved) ? saved : SETTINGS.defaultLevel, { silent: true, save: false });
  measureHeader();
  goToHash(true);
  if (window.rough) refreshRough();
  else window.addEventListener("load", () => refreshRough(), { once: true });

    const issues = audit();
    if (issues.length) console.warn("Guide audit:\n" + issues.join("\n")); else console.info("Guide audit: no issues found.");
  }
  window.GUIDE = { SETTINGS, NUMBERS, COMPANY_FACTS, GLOSSARY, PAGES, PAGE_PLAN, STORIES, computeEstimate, registerArt, registerBlock, onRender, onLevel, refreshRough, applyLevel, openGlossary, audit };
}
boot();
