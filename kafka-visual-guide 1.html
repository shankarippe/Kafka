<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafka: From Sticky Notes to Trillions of Events a Day</title>
<meta name="description" content="An illustrated, layered guide to Apache Kafka: from a town notice board to production configuration and system design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Patrick+Hand&display=swap">
<script>
/* Runs before first paint: marks JS as available and applies a saved theme, so there is no flash. */
(function () {
  document.documentElement.classList.add("js");
  try {
    var t = localStorage.getItem("kng-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* storage blocked: stay on automatic theme */ }
})();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
/* ===================================================================
   DESIGN TOKENS
   Colors carry meaning, never decoration:
   sender=blue · note=yellow · reader=green · pinni=orange · helper=purple
   architect=teal · alert=red (broken setups and failures only)
   =================================================================== */
:root {
  color-scheme: light;
  --paper: #fbf7ee; --card: #fffdf8; --rule: rgba(60, 100, 160, .13); --shadow: rgba(31, 29, 26, .16);
  --ink: #1f1d1a; --ink-soft: #4a453d; --muted: #625b50; --link: #1d56ad; --focus: #1a5fd0;
  --code-bg: rgba(31, 29, 26, .07); --face: #1f1d1a;
  --sender: #3b7dd8; --sender-soft: #dde9fa;
  --note: #ffd84d; --note-fold: #e6b800; --note-soft: #fff4c4; --note-ink: #1f1d1a;
  --reader: #3a9a4b; --reader-soft: #ddf1e1;
  --pinni: #f08a24; --pinni-dark: #c25c00; --pinni-soft: #fde5cc;
  --helper: #8455c9; --helper-soft: #ece2f8;
  --architect: #17837e; --architect-soft: #d3eeec;
  --alert: #c9322a; --alert-soft: #fbe0dc;
  --board: #ead9b8; --board-edge: #94744a;
  --hl: rgba(255, 214, 64, .62);
  --grid: rgba(23, 131, 126, .13);
  --lv1: #8a96a3; --lv2: #6a7889; --lv3: #4d5b6d; --lv4: #2f3c4e; --lv5: #17837e;
  --font-head: "Caveat", "Kalam", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  --font-body: "Patrick Hand", "Segoe Print", "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --header-h: 92px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #1b1916; --card: #24211d; --rule: rgba(150, 180, 230, .08); --shadow: rgba(0, 0, 0, .45);
    --ink: #f0e9dc; --ink-soft: #d3cabb; --muted: #b0a695; --link: #93bdff; --focus: #9cc2ff;
    --code-bg: rgba(240, 233, 220, .1);
    --sender: #6ea8f2; --sender-soft: #1f3049;
    --note: #f4cd4f; --note-fold: #c9a22a; --note-soft: #3a3218;
    --reader: #62c476; --reader-soft: #1b3523;
    --pinni: #ff9d47; --pinni-dark: #e07a1f; --pinni-soft: #40301d;
    --helper: #ac8fe3; --helper-soft: #2e2542;
    --architect: #3cc4bd; --architect-soft: #163533;
    --alert: #ff7466; --alert-soft: #45201b;
    --board: #3d3427; --board-edge: #a3875e;
    --hl: rgba(244, 205, 79, .32); --grid: rgba(60, 196, 189, .12);
    --lv1: #7c8794; --lv2: #98a4b2; --lv3: #b5c0cc; --lv4: #d5dde6; --lv5: #3cc4bd;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #1b1916; --card: #24211d; --rule: rgba(150, 180, 230, .08); --shadow: rgba(0, 0, 0, .45);
  --ink: #f0e9dc; --ink-soft: #d3cabb; --muted: #b0a695; --link: #93bdff; --focus: #9cc2ff;
  --code-bg: rgba(240, 233, 220, .1);
  --sender: #6ea8f2; --sender-soft: #1f3049;
  --note: #f4cd4f; --note-fold: #c9a22a; --note-soft: #3a3218;
  --reader: #62c476; --reader-soft: #1b3523;
  --pinni: #ff9d47; --pinni-dark: #e07a1f; --pinni-soft: #40301d;
  --helper: #ac8fe3; --helper-soft: #2e2542;
  --architect: #3cc4bd; --architect-soft: #163533;
  --alert: #ff7466; --alert-soft: #45201b;
  --board: #3d3427; --board-edge: #a3875e;
  --hl: rgba(244, 205, 79, .32); --grid: rgba(60, 196, 189, .12);
  --lv1: #7c8794; --lv2: #98a4b2; --lv3: #b5c0cc; --lv4: #d5dde6; --lv5: #3cc4bd;
}

/* ===================================================================
   BASE
   =================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 12px); -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0; font-family: var(--font-body); font-size: 1.15rem; line-height: 1.5; color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(to bottom, transparent calc(1.725rem - 1px), var(--rule) calc(1.725rem - 1px), var(--rule) 1.725rem);
  background-size: 100% 1.725rem;
}
h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.1; font-weight: 700; }
a { color: var(--link); text-underline-offset: .15em; }
code, kbd { font-family: var(--font-mono); font-size: .82em; background: var(--code-bg); padding: .05em .3em; border-radius: 4px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: .5rem; top: -4rem; z-index: 100; background: var(--ink); color: var(--paper); padding: .4rem .8rem; border-radius: 6px; }
.skip:focus { top: .5rem; }
#sprite-host, .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
html:not(.js) .topbar, html:not(.js) .doc-foot { display: none; }
.noscript { max-width: 40rem; margin: 3rem auto; padding: 1.5rem; border: 3px solid var(--ink); background: var(--card); font-size: 1.25rem; }
.noscript h1 { font-size: 2.4rem; margin-top: 0; }

/* ===================================================================
   STICKY HEADER: level filter · contents · glossary · theme
   =================================================================== */
.topbar { position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 2.5px solid var(--ink); }
@supports ((backdrop-filter: blur(4px)) and (background: color-mix(in srgb, red 50%, transparent))) {
  .topbar { background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(5px); }
}
.bar { max-width: 1340px; margin: 0 auto; padding: .45rem 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: .45rem .8rem; }
.brand { display: flex; align-items: center; gap: .45rem; color: var(--ink); text-decoration: none; font-family: var(--font-head); font-size: 1.75rem; font-weight: 700; line-height: 1; }
.brand svg { width: 34px; height: 37px; flex: none; }
.bar-actions { display: flex; gap: .4rem; order: 2; margin-left: auto; }
.btn { display: inline-flex; align-items: center; gap: .35rem; min-height: 40px; padding: .2rem .7rem; border: 2px solid var(--ink); border-radius: 10px 14px 9px 13px; background: var(--card); color: var(--ink); cursor: pointer; font-size: 1.05rem; line-height: 1.1; }
.btn:hover { background: var(--note-soft); }
.btn .ico { font-family: var(--font-mono); font-size: .9rem; line-height: 1; }
.level-filter { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; order: 1; }
#lf-label { font-family: var(--font-head); font-size: 1.35rem; font-weight: 700; margin-right: .15rem; }
.lf-opt { position: relative; display: inline-flex; }
.lf-opt input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.lf-opt .pill { display: inline-flex; align-items: center; gap: .3rem; min-height: 36px; min-width: 36px; justify-content: center; padding: .1rem .6rem; border: 2px solid var(--lvc); border-radius: 999px; background: var(--card); font-size: 1rem; }
.lf-opt.within .pill { background: var(--lvs, var(--card)); }
.lf-opt input:checked + .pill { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.lf-opt input:focus-visible + .pill { outline: 3px solid var(--focus); outline-offset: 2px; }
.lf-opt .pill b { font-family: var(--font-mono); font-size: .85rem; }
.progress { position: absolute; left: 0; bottom: -2.5px; height: 4px; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: var(--pinni); }
@media (max-width: 700px) {
  .brand-text, .lf-name { display: none; }
  .level-filter { order: 3; width: 100%; }
  #lf-label { font-size: 1.2rem; }
}
@media (max-width: 400px) { .btn { padding: .2rem .5rem; font-size: 1rem; } .bar { padding: .4rem .75rem; } }

/* ===================================================================
   PAGES AND BLOCKS
   Template: level badge → headline → illustration → caption → footer element
   =================================================================== */
main { display: block; max-width: 980px; margin: 0 auto; padding: 1rem 1rem 3rem; outline: none; }
.page { position: relative; margin: 2rem 0 3rem; padding: 1.25rem clamp(.75rem, 3vw, 1.75rem) 1rem; border: 2.5px solid var(--box-stroke, var(--ink)); border-radius: 10px 16px 12px 18px / 16px 10px 18px 12px; box-shadow: 5px 6px 0 var(--shadow); --box-sw: 2.5; }
.page.blueprint { --box-stroke: var(--architect); background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
.page-head { margin-bottom: .75rem; }
.page-no { margin: 0; font-size: .95rem; color: var(--muted); }
.page-badges { display: flex; flex-wrap: wrap; gap: .4rem; margin: .35rem 0; }
.page-head h2 { font-size: clamp(2rem, 6vw, 3rem); margin: .15rem 0 0; }
.page-head h2:focus { outline: none; }

.block { position: relative; margin: 1.1rem 0; padding: .9rem 1rem 1rem; border: 2px solid var(--box-stroke, var(--ink)); border-radius: 14px 7px 12px 9px / 9px 12px 7px 14px; background: var(--card); --box-sw: 2; }
.rough-box.has-rough { border-color: transparent; }
.rough-overlay { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 0; }
.rough-box > :not(.rough-overlay) { position: relative; z-index: 1; }
.block-head { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .6rem; margin-bottom: .45rem; }
.block-h { font-size: 1.65rem; margin: 0; flex-basis: 100%; }
.body { margin: .3rem 0 0; }

.badge { display: inline-flex; align-items: center; gap: .4rem; padding: .08rem .6rem .08rem .45rem; border: 2px solid var(--lvc); border-radius: 999px; background: var(--card); color: var(--ink); font-size: .95rem; line-height: 1.3; white-space: nowrap; }
@supports (background: color-mix(in srgb, red 50%, transparent)) {
  .badge, .toc-dot, .lf-opt { --lvs: color-mix(in srgb, var(--lvc) 18%, var(--card)); }
  .badge { background: var(--lvs); }
}
.lv-1 { --lvc: var(--lv1); } .lv-2 { --lvc: var(--lv2); } .lv-3 { --lvc: var(--lv3); } .lv-4 { --lvc: var(--lv4); } .lv-5 { --lvc: var(--lv5); }
.steps { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }
.steps i { display: block; width: 4px; border-radius: 1px; background: var(--lvc); opacity: .28; }
.steps i.on { opacity: 1; }
.story-chip { display: inline-flex; align-items: center; gap: .3rem; padding: .08rem .6rem; border: 2px dashed var(--ink-soft); border-radius: 8px; font-size: .95rem; background: var(--card); }

.panel-fig { margin: 0; }
.art-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
svg.art { display: block; width: 100%; height: auto; min-width: 300px; max-height: 440px; margin: 0 auto; }
.caption { margin: .6rem 0 0; font-size: 1.18rem; }
@media (max-width: 520px) { svg.art { min-width: 420px; } }
.scroll-hint { display: none; margin: .25rem 0 0; font-size: .85rem; color: var(--muted); text-align: center; }
.art-wrap.scrolls + .scroll-hint { display: block; }
.art-missing { padding: 1rem; border: 2px dashed var(--muted); text-align: center; color: var(--muted); border-radius: 8px; }

.tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .7rem; }
.tag { display: inline-flex; align-items: baseline; gap: .3rem; padding: .12rem .55rem; border: 2px dashed var(--ink-soft); border-radius: 8px; background: var(--card); color: var(--ink); cursor: pointer; font-size: .98rem; line-height: 1.3; text-align: left; }
.tag:hover { background: var(--note-soft); border-style: solid; }
.tag .tk { color: var(--muted); font-size: .88em; }
.tag { flex-wrap: wrap; }
.tag code { background: none; padding: 0; overflow-wrap: break-word; }
.tag-missing { border-color: var(--alert); cursor: default; }
.stamp { display: inline-block; font-family: var(--font-mono); font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: .05rem .4rem; border: 1.5px solid currentColor; border-radius: 4px; color: var(--ink-soft); transform: rotate(-2deg); white-space: nowrap; }
.stamp-verify { border-style: dashed; }
.source { margin: .6rem 0 0; font-size: .95rem; color: var(--muted); }
mark.hl { color: inherit; background: linear-gradient(100deg, transparent 0 1%, var(--hl) 2% 97%, transparent 99%); padding: 0 .2em; margin: 0 -.05em; border-radius: .4em .2em .5em .25em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

/* Footer elements */
.page-foot { margin-top: 1rem; }
.block.kind-remember { max-width: 34rem; margin: 1.4rem auto .6rem; padding-top: 1.5rem; background: var(--note); color: var(--note-ink); border: none; border-radius: 2px 3px 20px 2px; transform: rotate(-1.2deg); box-shadow: 3px 5px 0 var(--shadow); }
.block.kind-remember::before { content: ""; position: absolute; top: .45rem; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--pinni-dark); box-shadow: 1px 2px 0 rgba(0, 0, 0, .25); }
.kind-remember .badge { --lvc: #4d5b6d; background: rgba(255, 255, 255, .55); color: var(--note-ink); }
.kind-remember code { background: rgba(0, 0, 0, .08); color: var(--note-ink); }
.kind-remember a { color: #1d56ad; }
.kind-remember .tag { background: rgba(255, 255, 255, .6); color: var(--note-ink); border-color: rgba(31, 29, 26, .55); }
.kind-remember .tag .tk { color: #4a453d; }
.remember-title { font-family: var(--font-head); font-size: 1.65rem; font-weight: 700; margin: 0; }
.panel-title { font-family: var(--font-head); font-size: 1.55rem; font-weight: 700; margin: 0 0 .3rem; }
.rs-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
.rs-why { color: var(--ink-soft); }
.kind-decision { --box-stroke: var(--architect); }
.decision-dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem .8rem; margin: 0; }
.decision-dl dt { font-weight: 700; }
.decision-dl dd { margin: 0; }
@media (max-width: 520px) { .decision-dl { grid-template-columns: 1fr; } .decision-dl dd { margin-bottom: .4rem; } }

.page-nav { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem 1rem; margin-top: 1.4rem; padding-top: .7rem; border-top: 2px dashed var(--ink-soft); font-size: 1.02rem; }
.page-nav a { max-width: 48%; }
.page-nav a[rel="next"] { margin-left: auto; text-align: right; }
@media (max-width: 520px) { .page-nav a { max-width: 100%; } }

.page.stub { margin: 1rem 0; padding: .6rem 1rem; border: 2px dashed var(--muted); box-shadow: none; color: var(--muted); }
.page.stub h2 { font-size: 1.5rem; margin: 0; color: var(--ink-soft); }
.page.stub p { margin: 0; font-size: .95rem; }
@media (max-width: 480px) {
  main { padding: .75rem .5rem 2.5rem; }
  .page { padding: 1rem .6rem .8rem; }
  .block { padding: .75rem .6rem .8rem; }
}

/* SVG text inside drawings */
.svg-hand { font-family: var(--font-head); font-weight: 700; fill: var(--ink); }
.svg-note { font-family: var(--font-head); font-weight: 700; fill: var(--note-ink); }
.svg-mono { font-family: var(--font-mono); fill: var(--ink); }
.svg-muted { fill: var(--muted); }

/* ===================================================================
   DRAWERS: table of contents (left) and glossary (right)
   =================================================================== */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(15, 14, 12, .45); }
.drawer { position: fixed; top: 0; bottom: 0; z-index: 50; width: min(440px, 94vw); display: flex; flex-direction: column; background: var(--paper); border: 2.5px solid var(--ink); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s; }
.drawer.left { left: 0; border-left: 0; transform: translateX(-104%); }
.drawer.right { right: 0; border-right: 0; transform: translateX(104%); }
.drawer.open { transform: none; visibility: visible; transition: transform .22s ease, visibility 0s; }
.drawer-head { display: flex; align-items: center; gap: .5rem; padding: .55rem .9rem; border-bottom: 2px solid var(--ink); }
.drawer-head h2 { margin: 0 auto 0 0; font-size: 2.1rem; }
.drawer-body { overflow-y: auto; padding: .6rem .9rem 2rem; flex: 1; }
.toc-help { font-size: 1rem; color: var(--ink-soft); margin: .3rem 0 .5rem; }
.toc-legend { list-style: none; margin: 0 0 .5rem; padding: 0; display: flex; flex-wrap: wrap; gap: .35rem; }
.toc-part h3 { font-size: 1.5rem; margin: 1rem 0 .3rem; }
.toc-list { list-style: none; margin: 0; padding: 0; }
.toc-list a { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .45rem; padding: .25rem .35rem; border-radius: 8px; text-decoration: none; color: var(--ink); }
.toc-list a:hover { background: var(--note-soft); }
.toc-list a.dim { color: var(--muted); }
.toc-list a.dim .toc-dot { opacity: .55; }
.toc-dot { display: inline-grid; place-items: center; flex: none; width: 1.45rem; height: 1.45rem; border-radius: 50%; border: 2px solid var(--lvc); background: var(--lvs, var(--card)); font-family: var(--font-mono); font-size: .75rem; color: var(--ink); }
.toc-n { font-family: var(--font-mono); font-size: .82rem; color: var(--muted); }
.toc-soon { flex-basis: 100%; padding-left: 1.95rem; font-size: .85rem; color: var(--muted); }

.g-label { display: block; font-size: 1rem; margin-bottom: .2rem; }
.g-search { width: 100%; min-height: 42px; padding: .3rem .6rem; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); color: var(--ink); font: inherit; }
.g-count { font-size: .92rem; color: var(--muted); margin: .35rem 0 .4rem; }
.g-entry { display: grid; grid-template-columns: 50px 1fr; gap: .6rem; padding: .7rem .2rem; border-bottom: 1.5px dashed var(--ink-soft); scroll-margin-top: .5rem; border-radius: 6px; }
.g-entry:focus { outline: none; }
.g-entry:focus-visible { outline: 3px solid var(--focus); }
.g-entry h3 { margin: 0; font-size: 1.55rem; }
.g-kind { display: block; font-family: var(--font-body); font-size: .85rem; font-weight: 400; color: var(--muted); }
.g-term.mono { font-family: var(--font-mono); font-size: 1.02rem; font-weight: 600; overflow-wrap: anywhere; }
.g-entry p { margin: .25rem 0; font-size: 1.02rem; }
.g-boundary { font-size: .95rem !important; padding: .05rem .5rem; border-left: 4px solid var(--helper); background: var(--helper-soft); }
.g-icon { width: 50px; height: 50px; }
.g-entry.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 45% { background: var(--note-soft); } 100% { background: transparent; } }

.doc-foot { max-width: 980px; margin: 0 auto; padding: 0 1rem 3rem; color: var(--muted); font-size: .98rem; }
.doc-foot dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem .8rem; margin: .5rem 0; }
.doc-foot dt { font-weight: 700; color: var(--ink-soft); }
.doc-foot dd { margin: 0; }
@media (max-width: 520px) { .doc-foot dl { grid-template-columns: 1fr; } .doc-foot dd { margin-bottom: .3rem; } }

/* ---------- Stage 2 · Part 1 ---------- */
.page.cover .page-head h2 { font-size: clamp(2.5rem, 7.5vw, 4.6rem); line-height: .98; max-width: 16ch; }
.block.kind-lead { border: none; background: none; padding: 0; margin: .4rem 0 .2rem; }
.kind-lead .body { font-size: 1.4rem; color: var(--ink-soft); }
.kind-lead .block-head { display: none; } /* a subtitle line: the page badge above already shows its level */
.page.four-up .page-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); column-gap: 1rem; }
.page.four-up .page-body > .span-all { grid-column: 1 / -1; }
.page.four-up .page-body > .block:not(.span-all) { display: flex; flex-direction: column; }
.page.four-up .page-body > .block:not(.span-all) svg.art { min-width: 0; }

/* Pick your stop */
.stops { list-style: none; margin: .7rem 0 0; padding: 0; display: grid; gap: .55rem; }
.stop { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: .1rem .75rem; align-items: center; text-align: left; padding: .5rem .8rem; border: 2.5px solid var(--lvc); border-radius: 12px 8px 14px 9px; background: var(--card); color: var(--ink); cursor: pointer; }
.stop:hover { background: var(--note-soft); }
.stop-n { grid-row: span 2; display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 2.5px solid var(--lvc); font-family: var(--font-mono); font-weight: 600; }
.stop-name { font-family: var(--font-head); font-size: 1.6rem; font-weight: 700; line-height: 1.05; }
.stop-who { font-size: 1.02rem; color: var(--ink-soft); }
.stop[aria-pressed="true"], .stop[aria-pressed="true"]:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.stop[aria-pressed="true"] .stop-who { color: var(--paper); }
.stop[aria-pressed="true"] .stop-n { border-color: var(--paper); }
.stops-status { margin: .8rem 0 0; padding: .6rem .85rem; border: 2px dashed var(--ink-soft); border-radius: 10px; background: var(--note-soft); font-size: 1.05rem; }
.stops-status a { font-weight: 700; display: inline-block; }
.toast { position: fixed; left: 16px; right: 16px; bottom: 1.2rem; margin: 0 auto; width: fit-content; transform: translateY(1rem); max-width: 30rem; padding: .65rem 1rem; border-radius: 12px; background: var(--ink); color: var(--paper); font-size: 1.05rem; box-shadow: 0 6px 18px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; }
.toast.show { opacity: 1; transform: none; }
.toast-sub { display: block; font-size: .92rem; opacity: .85; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media print { .toast, .stops-status { display: none !important; } }

/* Signposts */
.signposts { position: relative; padding: .6rem 0 .6rem 2.4rem; margin-top: .5rem; }
.sign-pole { position: absolute; left: .9rem; top: 0; bottom: 0; width: 13px; background: var(--board-edge); border: 2px solid var(--ink); border-radius: 3px; }
.sign-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; justify-items: start; }
.sign { position: relative; display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 0 .7rem; min-height: 44px; padding: .3rem 2.4rem .35rem 1rem; color: var(--ink); text-decoration: none; transform: rotate(var(--tilt, 0deg)); }
.sign-shape { position: absolute; inset: 0; filter: drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink)); }
.sign-shape span { position: absolute; inset: 2px; background: var(--board); clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 50%, calc(100% - 24px) 100%, 0 100%); }
.sign > :not(.sign-shape) { position: relative; }
.sign-name { font-family: var(--font-head); font-size: 1.75rem; font-weight: 700; line-height: 1.1; }
.sign-lesson { font-size: 1.02rem; }
.sign:hover .sign-name { text-decoration: underline; text-decoration-thickness: 2px; }

/* Speech bubble */
.speech { display: flex; align-items: flex-end; gap: .9rem; margin-top: .2rem; }
.speech > svg { width: 72px; height: 78px; flex: none; }
.bubble { position: relative; margin: 0 0 1.2rem; padding: .7rem 1rem; border: 2.5px solid var(--ink); border-radius: 22px 18px 24px 16px; background: var(--pinni-soft); font-size: 1.25rem; }
.bubble p { margin: 0; }
.bubble::before, .bubble::after { content: ""; position: absolute; bottom: 14px; border-style: solid; border-color: transparent; }
.bubble::before { left: -17px; border-width: 9px 17px 9px 0; border-right-color: var(--ink); }
.bubble::after { left: -12px; border-width: 7px 13px 7px 0; border-right-color: var(--pinni-soft); }

/* Day in the life of a note */
.dil-controls { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .7rem; }
.btn:disabled { opacity: .5; cursor: default; background: var(--card); }
.dil-cap { min-height: 3.1em; margin: .6rem 0 0; font-size: 1.22rem; }
.dil-cap b { display: inline-block; margin-right: .3rem; padding: 0 .45rem; border-radius: 6px; background: var(--note); color: var(--note-ink); font-family: var(--font-mono); font-size: .82rem; font-weight: 600; }
.dil-all { display: none; }
.dil-new { transition: transform .9s ease, opacity .5s ease; transform-box: fill-box; transform-origin: center; }
.dil-new.at-hidden { opacity: 0; }
.dil-flag { transition: transform .9s ease; }
@media print {
  .dil-controls, .dil-cap { display: none !important; }
  .dil-all { display: block; margin: .5rem 0 0; padding-left: 1.4rem; }
}

/* ---------- Stage 3 · Part 2 ---------- */
.block.sidebar { --box-stroke: var(--ink-soft); background: var(--paper); }
.block.sidebar .block-h::before { content: ""; }
.layout-dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem .7rem; margin: .5rem 0 0; font-size: 1.02rem; }
.layout-dl dt { font-weight: 700; }
.layout-dl dd { margin: 0; }
.layout-dl { grid-template-columns: 1fr; gap: 0; }
.layout-dl dt { font-weight: 400; font-size: .9rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-top: .35rem; }

/* ---------- Stage 4 · Part 3 ---------- */
.comic { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem .9rem; }
@media (max-width: 560px) { .comic { grid-template-columns: 1fr; } }

.comic-panel figcaption { margin-top: .35rem; font-size: 1.08rem; }
.comic-n { position: absolute; top: -.7rem; left: -.6rem; z-index: 2; display: grid; place-items: center; width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--ink); color: var(--paper); font-family: var(--font-mono); font-size: .85rem; font-weight: 600; }
.scale-badge { display: flex; align-items: center; gap: 1rem; }
.scale-badge > svg { width: 80px; height: 100px; flex: none; }
.scale-label { margin: 0; font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; }
.year-chip { display: inline-block; margin-left: .3rem; padding: 0 .5rem; border: 2px solid var(--ink); border-radius: 999px; font-family: var(--font-mono); font-size: .85rem; vertical-align: middle; }
.scale-fig { margin: .1rem 0; font-family: var(--font-head); font-size: clamp(1.7rem, 4.5vw, 2.4rem); font-weight: 700; line-height: 1.05; }
.scale-cmp { margin: .2rem 0 0; font-size: 1.15rem; }
.scale-math { margin: .1rem 0 0; font-family: var(--font-mono); font-size: .85rem; color: var(--ink-soft); }
.scale-note { margin: .25rem 0 0; font-size: .98rem; color: var(--ink-soft); }
.lesson { margin: .6rem 0 0; font-size: 1.2rem; }
.lesson-k { font-family: var(--font-head); font-size: 1.4rem; font-weight: 700; }
.builder { display: grid; grid-template-columns: minmax(0, 320px) 1fr; gap: .4rem 1.2rem; align-items: start; }
@media (max-width: 640px) { .builder { grid-template-columns: 1fr; } }

.tri-legend { margin: .2rem 0 0; font-size: .92rem; color: var(--ink-soft); }
.tri-link { margin: .3rem 0 0; font-size: 1rem; }
.kind-challenge { --box-stroke: var(--lv4); }
.challenge-q { display: flex; gap: .7rem; align-items: flex-start; margin: .2rem 0 0; font-size: 1.22rem; }
.challenge-mark { flex: none; display: grid; place-items: center; width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 2.5px solid var(--ink); font-family: var(--font-head); font-size: 1.7rem; font-weight: 700; line-height: 1; }
.kind-lens { --box-stroke: var(--architect); background-color: var(--card); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 18px 18px; }
.lens { display: flex; gap: .9rem; align-items: flex-start; }
.lens > svg { width: 70px; height: 78px; flex: none; }
.lens dl { margin: 0; }
.lens dt { font-family: var(--font-head); font-size: 1.4rem; font-weight: 700; }
.lens dd { margin: 0 0 .4rem; font-size: 1.12rem; }
.block.kind-companyFoot { border: none; background: none; padding: .2rem 0; margin: .6rem 0 0; border-top: 2px dashed var(--ink-soft); border-radius: 0; }
.kind-companyFoot .block-head { display: none; }
.cf-story, .cf-source { margin: .35rem 0 0; font-size: 1.02rem; }
.cf-story { font-weight: 700; }
.town-map { max-height: 560px; }
.map-hit { fill: transparent; stroke: none; }
.halo { paint-order: stroke fill; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; }
.map-link { cursor: pointer; }
.map-link:hover .map-name { text-decoration: underline; }
.map-link:focus { outline: none; }
.map-link:focus-visible .map-hit { stroke: var(--focus); stroke-width: 4; stroke-dasharray: 8 5; }
.map-list { margin: .6rem 0 0; padding-left: 1.2rem; font-size: 1.02rem; columns: 2 16rem; }
.rd-bad { transition: opacity .4s ease; }
.rd-chip { align-self: center; font-size: 1.05rem; }
.rd-chip b { font-family: var(--font-mono); }
.rd-chip b.bad { color: var(--alert); }
@media print { .rd-chip { display: none; } }
.rd-flag { transition: transform .9s ease; }
.rd-back { transition: opacity .4s ease; }
@media print { .comic-panel { break-inside: avoid; } }

/* ---------- Stage 5 · Part 4 ---------- */
.rs-val code { font-size: .85em; }
.tbl-wrap { overflow-x: auto; margin-top: .3rem; }
.tbl { width: 100%; border-collapse: collapse; font-size: 1rem; min-width: 520px; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: .4rem .55rem; border-bottom: 1.5px dashed var(--ink-soft); }
.tbl thead th { font-family: var(--font-head); font-size: 1.25rem; border-bottom: 2.5px solid var(--ink); }
.tbl tbody th { font-weight: 700; }
.tbl code { white-space: nowrap; }
.tp { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: .8rem 1.4rem; margin-top: .6rem; }
@media (max-width: 720px) { .tp { grid-template-columns: 1fr; } }
.tp-controls { display: grid; gap: .6rem; align-content: start; }
.tp-story-l { font-family: var(--font-head); font-size: 1.35rem; font-weight: 700; }
.tp-story { min-height: 42px; padding: .2rem .5rem; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); color: var(--ink); font: inherit; }
.tp-changed { margin: -.2rem 0 0; min-height: 1.2em; font-size: .92rem; color: var(--ink-soft); }
.tp-field { margin: 0; padding: .4rem .6rem .55rem; border: 2px solid var(--ink-soft); border-radius: 10px; }
.tp-field legend, .tp-range label { padding: 0 .3rem; font-size: 1rem; }
.tp-opt { display: inline-flex; align-items: center; gap: .3rem; margin: .2rem .9rem .1rem 0; min-height: 36px; cursor: pointer; }
.tp-opt input { width: 1.15rem; height: 1.15rem; accent-color: var(--ink); }
.tp-range input { width: 100%; min-height: 36px; accent-color: var(--pinni-dark); }
.tp-range output { font-family: var(--font-mono); font-weight: 600; }
.tp-out svg.art { min-width: 0; max-width: 420px; }
.tp-dot { transition: transform .5s ease; }
.tp-summary { margin: .4rem 0 0; font-size: 1.15rem; }
.tp-warn { list-style: none; margin: .4rem 0 0; padding: 0; display: grid; gap: .35rem; }
.tp-warn li { padding: .35rem .6rem; border: 2px solid var(--alert); border-radius: 8px; background: var(--alert-soft); color: var(--ink); }
.tp-math { margin-top: .5rem; }
.tp-math summary { cursor: pointer; font-weight: 700; min-height: 32px; }
.tp-tbl { min-width: 360px; font-size: .95rem; }
.tp-tbl td { font-family: var(--font-mono); font-size: .85rem; }
.tp-sum th, .tp-sum td { border-bottom: 2.5px solid var(--ink); }
.tp-rule, .tp-note { font-size: .95rem; color: var(--ink-soft); margin: .4rem 0 0; }
.tp-note { grid-column: 1 / -1; }
@media print { .tp-math { display: block; } .tp-math > summary { display: none; } }

/* ---------- Stage 6 · Part 5 ---------- */
.cc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem 1.2rem; }
@media (max-width: 680px) { .cc { grid-template-columns: 1fr; } }
.cc-sec { border-top: 2px dashed var(--ink-soft); padding-top: .4rem; }
.cc-sec h4 { margin: .2rem 0 .25rem; font-family: var(--font-head); font-size: 1.4rem; }
.cc-sec p, .cc-sec li { margin: .2rem 0; font-size: 1.05rem; }
.cc-sec ul, .cc-sec ol { margin: .2rem 0; padding-left: 1.3rem; }
.cc-tri svg.art { min-width: 0; max-width: 300px; }
.cc-small { font-size: .98rem !important; color: var(--ink-soft); }
.cc-warn { padding: .4rem .6rem; border-left: 4px solid var(--alert); background: var(--alert-soft); }
.cc-chal { grid-column: 1 / -1; }
.rs-group { margin: .5rem 0 .2rem; font-size: 1.05rem; font-family: var(--font-body); font-weight: 700; }
.flips { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 1rem; }
.flip { perspective: 1400px; }
.flip-inner { display: grid; height: 100%; transition: transform .6s ease; transform-style: preserve-3d; }
.flip-face { grid-area: 1 / 1; display: flex; flex-direction: column; gap: .3rem; padding: .7rem .8rem; border: 2px solid var(--ink); border-radius: 12px 8px 14px 9px; background: var(--card); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip-face h4 { margin: 0; font-family: var(--font-head); font-size: 1.45rem; line-height: 1.1; }
.flip-face p, .flip-face dd { margin: 0; font-size: 1.04rem; }
.flip-face svg.art { min-width: 0; }
.flip-face .flip-btn { margin-top: auto; align-self: flex-start; }
.flip-back { transform: rotateY(180deg); background: var(--paper); }
.flip-back dt { font-weight: 700; margin-top: .3rem; }
.flip-back dd { margin: 0; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.flip-tag { font-family: var(--font-mono); font-size: .78rem !important; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.checklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: .4rem 1.2rem; margin-top: .4rem; }
.checklist h4 { margin: .5rem 0 .2rem; font-family: var(--font-head); font-size: 1.4rem; }
.checklist ul { list-style: none; margin: 0; padding: 0; }
.checklist li { display: flex; gap: .5rem; align-items: flex-start; margin: .3rem 0; font-size: 1.06rem; }
.checklist input { flex: none; width: 1.2rem; height: 1.2rem; margin-top: .25rem; accent-color: var(--ink); }
.cheat-tbl { min-width: 0; }
.cheat-lessons { margin: .2rem 0 0; padding-left: 1.2rem; }
.cheat-lessons li { margin: .3rem 0; }
@media print {
  .flip-inner, .flip.flipped .flip-inner, .flip-back { transform: none !important; }
  .flip-inner { display: block; }
  .flip-face { backface-visibility: visible; -webkit-backface-visibility: visible; margin-bottom: .4rem; break-inside: avoid; }
  .flip-btn, .flip-all { display: none !important; }
}

/* ---------- Stage 7 · Part 6 ---------- */
.step-chip { display: inline-flex; align-items: center; gap: .3rem; padding: .05rem .55rem .05rem .3rem; border: 2px solid var(--architect); border-radius: 8px; background: var(--card); color: var(--ink); font-size: .95rem; text-decoration: none; white-space: nowrap; }
.step-chip:hover { background: var(--architect-soft); }
.step-chip svg { width: 20px; height: 23px; }
.dt { margin-top: .3rem; }
.dt-path { margin: 0 0 .5rem; padding-left: 1.3rem; color: var(--ink-soft); font-size: 1rem; }
.dt-path:empty { display: none; }
.dt-now { padding: .8rem 1rem; border: 2.5px solid var(--architect); border-radius: 12px; background: var(--card); }
.dt-now h4 { margin: .1rem 0 .6rem; font-family: var(--font-head); font-size: 1.7rem; line-height: 1.15; }
.dt-now h4:focus { outline: none; }
.dt-k { margin: 0; font-family: var(--font-mono); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.dt-btns { display: flex; flex-wrap: wrap; gap: .5rem; }
.dt-btns .btn { min-width: 5.5rem; justify-content: center; }
.dt-result p { margin: .2rem 0 .6rem; font-size: 1.1rem; }
.dt-print { display: none; }
.est { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: .8rem 1.4rem; margin-top: .6rem; }
@media (max-width: 720px) { .est { grid-template-columns: 1fr; } }
.est-in { display: grid; gap: .45rem; align-content: start; }
.est-f { display: grid; gap: .1rem; font-size: 1rem; }
.est-f input { min-height: 40px; padding: .2rem .5rem; border: 2px solid var(--ink); border-radius: 8px; background: var(--card); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; }
.est-res { margin: 0; display: grid; gap: .55rem; }
.est-res > div { padding: .4rem .7rem; border: 2px solid var(--ink-soft); border-radius: 10px; background: var(--card); }
.est-res dt { font-family: var(--font-head); font-size: 1.3rem; font-weight: 700; }
.est-res dd { margin: 0; display: grid; }
.est-v { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 600; }
.est-how { font-size: .95rem; color: var(--ink-soft); }
.est-note { font-size: .95rem; color: var(--ink-soft); }
.est-bad { padding: .4rem .6rem; border: 2px solid var(--alert); border-radius: 8px; background: var(--alert-soft); }
.flips-fail .flip-face { min-height: 16rem; }
.flips-fail svg.art { max-height: 120px; }
.req { margin: .2rem 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: .5rem 1rem; }
.req > div { padding: .4rem .6rem; border-left: 4px solid var(--architect); background: var(--card); }
.req dt { font-weight: 700; }
.req dd { margin: .1rem 0 0; font-size: 1.04rem; }
.rd-design { max-height: 520px; }
.rd-step { opacity: .1; transition: opacity .5s ease; }
.rd-step.on { opacity: 1; }
.rv-list { margin: .6rem 0 0; padding-left: 1.4rem; }
.rv-list li { margin: .3rem 0; font-size: 1.08rem; }
.rv-list li.now { background: var(--note-soft); border-radius: 6px; }
.poster { margin-top: .4rem; padding: 1rem; border: 4px double var(--ink); border-radius: 6px; background: var(--paper); }
.ps-head { display: flex; align-items: center; gap: .8rem; }
.ps-head svg { width: 64px; height: 70px; flex: none; }
.ps-title { margin: 0; font-family: var(--font-head); font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 700; line-height: 1.05; }
.ps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: .7rem; margin-top: .7rem; }
.ps-tile { padding: .5rem .7rem; border: 2px solid var(--ink); border-radius: 10px 6px 12px 7px; background: var(--card); }
.ps-tile h4 { margin: 0 0 .2rem; font-family: var(--font-head); font-size: 1.45rem; }
.ps-tile p, .ps-tile li { margin: .15rem 0; font-size: 1rem; }
.ps-tile ul, .ps-tile ol { margin: 0; padding-left: 1.1rem; }
.ps-big { font-family: var(--font-head); font-size: 1.5rem !important; font-weight: 700; }
.ps-foot { margin: .6rem 0 0; font-size: .9rem; color: var(--muted); text-align: right; }
.quiz-list { margin: .3rem 0 0; padding-left: 1.4rem; display: grid; gap: 1rem; }
.quiz-text { margin: 0 0 .4rem; font-size: 1.15rem; font-weight: 700; }
.quiz-opts { display: grid; gap: .4rem; }
.quiz-opt { display: block; width: 100%; min-height: 42px; padding: .35rem .7rem; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); color: var(--ink); text-align: left; cursor: pointer; font-size: 1.05rem; }
.quiz-opt:hover:not(:disabled) { background: var(--note-soft); }
.quiz-opt:disabled { cursor: default; }
.answered .quiz-opt.is-answer { border-color: var(--reader); background: var(--reader-soft); }
.answered .quiz-opt.picked:not(.is-answer) { border-color: var(--alert); background: var(--alert-soft); }
.quiz-mark { font-weight: 700; }
.quiz-fb { margin: .3rem 0 0; font-weight: 700; min-height: 1.2em; }
.quiz-why { display: none; margin: .1rem 0 0; }
.answered .quiz-why { display: block; }
.quiz-score { font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; margin: .8rem 0 .4rem; min-height: 1.2em; }
@media print {
  .dt-now, .dt-path { display: none !important; }

}

/* ---------- Part 7 · Interview deep-dive ---------- */
svg.art.art-small { max-width: 560px; }
.qa { margin: .3rem 0 0; padding-left: 1.6rem; display: grid; gap: .4rem; }
.qa details { padding: .35rem .7rem; border: 2px solid var(--ink-soft); border-radius: 10px; background: var(--card); }
.qa details[open] { border-color: var(--ink); }

function computeEstimate(i) {
  const u = NUMBERS.units;
  const eventsPerDay = i.ordersPerDay * i.eventsPerOrder;
  const avgPerSec = Math.round(eventsPerDay / u.secondsPerDay);
  const peakPerSec = avgPerSec * i.peakMultiplier;
  const peakMBps = (peakPerSec * i.avgSizeKB) / u.kbPerMb;
  const gbPerDay = (eventsPerDay * i.avgSizeKB) / u.kbPerGb;

  const gbOnDisk = gbRetained * i.replicationFactor;
  const perConsumerPerSec = 1000 / i.processingMs;
  const minPartitions = Math.ceil(peakPerSec / perConsumerPerSec);
  return { eventsPerDay, avgPerSec, peakPerSec, peakMBps, gbPerDay, gbRetained, gbOnDisk, perConsumerPerSec, minPartitions };

        text: "compression.type shrinks each batch before it travels; the default is {{NUMBERS.kafkaDefaults.compression.type}}. lz4 is light on CPU; zstd squeezes harder. Gains VOLUME: less network and disk. Costs CPU on senders and readers, and a little FRESHNESS. Bigger batches compress better, so batching and compression work together.",
        tags: ["Real setting: compression.type"] },
      { level: 3, kind: "panel", art: "producerAcks", className: "span-all", headline: "Receipts",
        text: "acks is the receipt the sender waits for. 0: none. 1: the leader alone. all, the default since Kafka 3.0: every in-sync copy. Moving towards all gains SAFETY and costs a little FRESHNESS. With acks=1, a leader crash just after the receipt can lose the note. How much all protects depends on min.insync.replicas ([page 20](#p20-durability)).",
        tags: ["Real setting: acks", "Real term: in-sync replicas (ISR)"] },
      { level: 3, kind: "panel", art: "producerIdem", headline: "Never pinning twice",
        text: "Networks fail, so senders retry, and a retry can pin the same note twice. enable.idempotence, on by default since Kafka 3.0, lets the broker spot repeats from the same sender and keep each column in order. Gains SAFETY at almost no cost. It only covers one sender session: after a restart duplicates can still appear, so readers should dedupe by event ID.",
        tags: ["Real setting: enable.idempotence", "Real term: idempotent consumer"] },
      { level: 3, kind: "panel", art: "producerTxn", headline: "All or nothing",
        text: "transactional.id lets a sender pin several notes on several boards all or nothing, and save a reader's bookmark in the same step: exactly-once read-process-write inside Kafka. Readers set isolation.level=read_committed to skip unsealed envelopes. Gains SAFETY; costs FRESHNESS (readers wait for the seal) and complexity. A bank or email outside Kafka still needs idempotent writes.",
        tags: ["Real setting: transactional.id", "Real setting: isolation.level"] },
      { level: 3, kind: "text", className: "span-all", headline: "Our stories, as senders",
        text: "UPI payment keeps acks=all and idempotence, plus transactions where it reads, processes and writes. Pizza order keeps acks=all and idempotence. Live cab location keeps linger.ms small (0–5) with lz4. Website clicks raises linger.ms (10–50), grows batch.size and uses zstd or lz4. These are starting points: load-test, then adjust. Full cards from [page 24](#p24-card-upi).",
        label: "hypothetical" },
      { level: 3, kind: "realSettings", realSettings: [
        { name: "batch.size", value: "default `{{NUMBERS.kafkaDefaults.batch.size}}` bytes", why: "VOLUME ↑, FRESHNESS ↓ (a little)" },
        { name: "linger.ms", value: "default `{{NUMBERS.kafkaDefaults.linger.ms}}`", why: "VOLUME ↑, FRESHNESS ↓" },
        { name: "compression.type", value: "default `{{NUMBERS.kafkaDefaults.compression.type}}`", why: "VOLUME ↑, CPU cost" },
        { name: "acks", value: "default `{{NUMBERS.kafkaDefaults.acks}}`", why: "SAFETY ↑, FRESHNESS ↓" },
        { name: "enable.idempotence", value: "default `{{NUMBERS.kafkaDefaults.enable.idempotence}}`", why: "SAFETY ↑, almost free" },
        { name: "transactional.id", value: "not set by default", why: "SAFETY ↑, FRESHNESS ↓, more complexity" }
      ] }
    ]
  },
  {
    id: "p20-durability", part: 4, title: "Not losing anything", useCase: "upi",
    blocks: [
      { level: 3, kind: "panel", art: "rfMinIsr", headline: "Three copies, two must agree",
        text: "Replication factor 3 keeps three copies of each column in different buildings. min.insync.replicas=2 means a write with acks=all needs at least two up-to-date copies, leader included, before the receipt. Lose one building: writes continue. Lose two: Kafka refuses writes with NotEnoughReplicas rather than risk losing them. Gains SAFETY; costs disk, network and some availability. The defaults are {{NUMBERS.derived.defaultReplicationFactor}} and {{NUMBERS.kafkaDefaults.min.insync.replicas}}, so set both on purpose.",
        tags: ["Real term: replication factor", "Real setting: min.insync.replicas", "Real term: NotEnoughReplicas"] },
      { level: 3, kind: "panel", art: "ackAllIsr", headline: "What acks=all does and doesn't promise",
        text: "acks=all waits for every copy that is in sync right now. If the followers fall behind, they drop out of that list, and with min.insync.replicas=1, “all” can mean the leader alone. Lose the leader then, and the note is gone. acks=all also doesn't stop duplicates (idempotence does) or protect anything outside Kafka, like Arjun's bank.",
        tags: ["Real setting: acks", "Real term: in-sync replicas (ISR)", "Real setting: min.insync.replicas"] },
      { level: 3, kind: "panel", art: "uncleanElection", headline: "When only an old copy is left",
        text: "If every in-sync copy is lost, only an out-of-date copy may remain. With unclean.leader.election.enable=false, the default, Kafka waits for an up-to-date copy: nothing lost, but the column is offline meanwhile. With true, the old copy takes over at once and the notes it never got are silently lost. Keep false for payments and orders; a team might accept true for clicks to stay writable.",
        tags: ["Real setting: unclean.leader.election.enable", "Real term: offline partitions"] },
      { level: 3, kind: "text", headline: "Our stories",
        text: "UPI payment and pizza order: replication factor 3, min.insync.replicas=2, unclean election off. Live cab location: the same, or relaxed, because losing one position is fine when the next arrives in seconds. Website clicks: the extra copies usually cost little with batching; relax them only if cost truly dominates.",
        label: "hypothetical" },
      { level: 3, kind: "realSettings", realSettings: [
        { name: "replication factor", term: true, value: "production guidance {{NUMBERS.productionGuidance.replicationFactor}}", why: "SAFETY ↑; costs disk and network" },
        { name: "default.replication.factor", value: "default `{{NUMBERS.kafkaDefaults.default.replication.factor}}`", why: "used when a topic doesn't say" },
        { name: "min.insync.replicas", value: "default `{{NUMBERS.kafkaDefaults.min.insync.replicas}}`; guidance {{NUMBERS.productionGuidance.minInsyncReplicas}}", why: "SAFETY ↑ with acks=all; costs availability" },
        { name: "unclean.leader.election.enable", value: "default `{{NUMBERS.kafkaDefaults.unclean.leader.election.enable}}`", why: "false keeps SAFETY; true trades it for availability" },
        { name: "acks", value: "default `{{NUMBERS.kafkaDefaults.acks}}`", why: "only as strong as min.insync.replicas" }
      ] }
    ]
  },
  {
    id: "p21-consumer", part: 4, title: "Reading notes: consumers", className: "four-up",
    blocks: [
      { level: 3, kind: "panel", art: "parallelCap", className: "span-all", headline: "Columns cap parallel reading",
        text: "Within one team, at most one reader per column, so the column count caps how many readers can work in parallel. Here, four columns keep four readers busy and two sleep. Need more? Plan columns ahead: adding columns later moves keys to different columns ([page 22](#p22-how-many-columns)). For queue-style work, share groups lift the cap.",
        tags: ["Real term: partition", "Real term: consumer group", "Real term: share group"] },
      { level: 3, kind: "panel", art: "consumerFetch", headline: "How much to fetch",
        text: "A reader can ask the board to wait until at least fetch.min.bytes of notes are ready (default {{NUMBERS.kafkaDefaults.fetch.min.bytes}} byte), but no longer than fetch.max.wait.ms (default {{NUMBERS.kafkaDefaults.fetch.max.wait.ms}} ms). Raising fetch.min.bytes gains VOLUME: fewer, bigger fetches. It costs FRESHNESS when traffic is light. max.poll.records (default {{NUMBERS.kafkaDefaults.max.poll.records}}) caps how many notes one poll hands back.",
        tags: ["Real setting: fetch.min.bytes", "Real setting: fetch.max.wait.ms", "Real setting: max.poll.records"] },
      { level: 3, kind: "panel", art: "consumerPoll", headline: "Don't look away too long",
        text: "max.poll.interval.ms (default {{NUMBERS.kafkaDefaults.max.poll.interval.ms}} ms, five minutes) is how long a reader may take between polls. Take longer and the reader is treated as stuck: it leaves the team and its columns are re-dealt, a rebalance, so some work may be done twice. Slow handlers? Take fewer records per poll, or speed them up. From Kafka 4.0, group.protocol=consumer makes rebalances calmer.",
        tags: ["Real setting: max.poll.interval.ms", "Real term: rebalance", "Real setting: group.protocol"] },
      { level: 3, kind: "panel", art: "commitTiming", className: "span-all", headline: "When to move the bookmark",
        text: "enable.auto.commit=true, the default, moves the bookmark on a timer, every {{NUMBERS.kafkaDefaults.auto.commit.interval.ms}} ms. If your code hands notes to background work, the bookmark can pass notes that were never finished, and a crash skips them. Commit after processing instead: a crash then repeats a few notes, so make handlers idempotent. Gains SAFETY; costs a little extra code.",
        tags: ["Real setting: enable.auto.commit", "Real setting: auto.commit.interval.ms", "Real term: idempotent consumer"] },
      { level: 3, kind: "table", className: "span-all", headline: "Delivery guarantees",
        table: {
          head: ["Guarantee", "How", "What can go wrong", "Fits"],
          rows: [
            ["At most once", "Move the bookmark, then process", "May lose a note; never repeats", "Website clicks, if a small loss is fine"],
            ["At least once", "Process, then move the bookmark", "Never loses; may repeat", "Pizza order, with idempotent handlers"],
            ["Exactly once, inside Kafka", "Transactions plus `isolation.level=read_committed`", "Each note's effect lands once, within Kafka only", "UPI read-process-write; the bank side still dedupes by payment ID"]
          ]
        },
        text: "Exactly-once covers reading, processing and writing within Kafka. Once a bank, database or email is involved, use idempotent writes, deduplication by event ID, or the outbox pattern ([page 35](#p35-patterns)).",
        tags: ["Real term: delivery guarantee", "Real setting: isolation.level", "Real term: transactional outbox"] },
      { level: 3, kind: "realSettings", realSettings: [
        { name: "fetch.min.bytes", value: "default `{{NUMBERS.kafkaDefaults.fetch.min.bytes}}`", why: "VOLUME ↑, FRESHNESS ↓" },
        { name: "fetch.max.wait.ms", value: "default `{{NUMBERS.kafkaDefaults.fetch.max.wait.ms}}`", why: "caps the wait" },
        { name: "max.poll.records", value: "default `{{NUMBERS.kafkaDefaults.max.poll.records}}`", why: "smaller batches finish within the poll limit" },
        { name: "max.poll.interval.ms", value: "default `{{NUMBERS.kafkaDefaults.max.poll.interval.ms}}`", why: "too short causes needless rebalances" },
        { name: "enable.auto.commit", value: "default `{{NUMBERS.kafkaDefaults.enable.auto.commit}}`", why: "false + commit after processing: SAFETY ↑" },
        { name: "auto.commit.interval.ms", value: "default `{{NUMBERS.kafkaDefaults.auto.commit.interval.ms}}`", why: "only used with auto-commit" },
        { name: "isolation.level", value: "default `{{NUMBERS.kafkaDefaults.isolation.level}}`", why: "read_committed for transactions" },
        { name: "group.protocol", value: "`consumer` = the newer protocol (Kafka 4.0+)", why: "calmer rebalances" }
      ] }
    ]
  },
  {
    id: "p22-how-many-columns", part: 4, title: "How many columns?", useCase: "pizza",
    blocks: [
      { level: 3, kind: "panel", art: "sizingFormula", headline: "Measure, then divide", label: "hypothetical",
        text: "Measure, don't guess. Load-test how many notes per second one column handles when sending and when reading. Divide your peak by each, take the larger number, then add headroom for growth. In the pizza estimate, one reader handles {{NUMBERS.estimate.derived.perConsumerPerSec}} notes per second, so a peak of {{NUMBERS.estimate.derived.peakPerSec}} needs at least {{NUMBERS.estimate.derived.minPartitions}} columns; we chose {{NUMBERS.estimate.recommendedPartitions}} ([page 34](#p34-estimate-it)).",
        tags: ["Real term: partition", "Real term: consumer group"] },
      { level: 3, kind: "panel", art: "tooFewTooMany", headline: "Too few, too many",
        text: "Too few columns: a traffic jam, and you can't add readers to help. Too many: every column costs memory, open files and copying work, and recovery after a broker failure takes longer. You can add columns later, but keyed notes then land in different columns, so per-key order breaks across the change. Size with headroom up front, or create a new board and move readers over.",
        tags: ["Real term: partition", "Real term: key"] },
      { level: 3, kind: "panel", art: "hotPartition", headline: "Hot columns from skewed keys",
        text: "Skewed keys make a hot partition. Key cab locations by city and the Mumbai column overflows while others sit idle; one reader can't keep up, whatever the column count. Pick keys with many, evenly busy values: driver ID for cabs. Walmart's item + store key is a good example: many combinations, each with one writer ([page 16](#p16-walmart)).",
        tags: ["Real term: hot partition", "Real term: key"] },
      { level: 3, kind: "realSettings", realSettings: [
        { name: "partition", term: true, value: "count is chosen when a topic is created", why: "it can grow later, but keys then move" },
        { name: "key", term: true, value: "decides the column", why: "many, evenly busy values avoid hot partitions" }
      ] }
    ]
  },
  {
    id: "p23-is-it-healthy", part: 4, title: "Is it healthy?",
    blocks: [
      { level: 3, kind: "panel", art: "lagPile", headline: "Lag: the number-one metric", useCase: "cab",
        text: "Consumer lag is how far each team's bookmark is behind the newest note, per column. Flat lag is fine; lag that keeps growing means readers can't keep up, and for Meena's cab, positions go stale. Alert on lag that grows for several minutes, or on the age of the oldest unread note, not on one spike.",
        tags: ["Real term: consumer lag", "Real term: offset"] },
      { level: 3, kind: "panel", art: "healthBoard", headline: "Watch the board too", label: "illustrative",
        text: "Readers are only half the picture. Watch the buildings as well: copies falling behind, columns with no leader, slow requests, full disks, busy networks and readers that keep dropping out. Each needs an alert and a named owner.",
        tags: ["Real term: under-replicated partitions", "Real term: offline partitions", "Real term: rebalance"] },
      { level: 3, kind: "table", headline: "What to watch",
        table: {
          head: ["Metric", "What it tells you", "First thing to check"],
          rows: [
            ["Consumer lag", "Readers are falling behind", "Handler speed; readers vs columns; `max.poll.records`"],

            ["Offline partitions", "A column has no leader: no reads or writes", "Page someone now"],
            ["Request latency (send and fetch)", "Senders and readers wait longer", "Busy brokers, disk, batching settings"],
            ["Disk usage", "Space is running out", "`retention.ms`, traffic growth, tiered storage"],
            ["Network", "Links near their limit slow everything, copying included", "`compression.type`, more brokers"],
            ["Rebalance rate", "Readers keep dropping out", "`max.poll.interval.ms`, slow handlers, `group.protocol`"]
          ]
        } },
      { level: 3, kind: "realSettings", realSettings: [
        { name: "max.poll.interval.ms", value: "default `{{NUMBERS.kafkaDefaults.max.poll.interval.ms}}`", why: "frequent rebalances often start here" },
        { name: "group.protocol", value: "`consumer` (Kafka 4.0+)", why: "calmer rebalances" },
        { name: "retention.ms", value: "default `{{NUMBERS.kafkaDefaults.retention.ms}}` ({{NUMBERS.derived.defaultRetentionDays}} days)", why: "disk use grows with it" },
        { name: "tiered storage", term: true, value: "production-ready since Kafka 3.9", why: "long retention on cheaper storage" }
      ] }
    ]
  },

  {
    id: "p35-patterns", part: 6, title: "Patterns on the board", className: "four-up",
    blocks: [
      { level: 5, kind: "panel", art: "patOutbox", step: 4, headline: "Transactional outbox",
        text: "The order service writes the order and an “event to publish” row in one database transaction; a relay, often CDC, pins that row to Kafka. **Use when:** a database change and an event must never disagree. **Watch out for:** the relay can publish a row twice, so readers dedupe by event ID, and the outbox table needs cleaning.",
        tags: ["Real term: transactional outbox", "Real term: change data capture (CDC)"] },
      { level: 5, kind: "panel", art: "patCdc", step: 3, headline: "Change data capture",
        text: "A van reads the database's change log and pins every insert, update and delete as a note. Debezium, a separate project, usually runs as connectors on Kafka Connect, which is part of Kafka. **Use when:** systems you can't change write to a database. **Watch out for:** notes mirror table rows, not business events, and upstream schema changes ripple downstream.",
        tags: ["Real term: change data capture (CDC)", "Real term: Debezium", "Real term: Kafka Connect"] },
      { level: 5, kind: "panel", art: "patHistory", step: 4, headline: "Event sourcing and CQRS",
        text: "Store every change as an event and rebuild state by replaying it; build read-optimised views from the same events (CQRS). The New York Times rebuilds search from its Monolog; Walmart works out stock per item and store. **Use when:** history and audit matter, or many views need the same facts. **Watch out for:** replays take time, and old formats must stay readable.",
        tags: ["Real term: event sourcing", "Real term: log"] },
      { level: 5, kind: "panel", art: "patSaga", step: 5, headline: "Saga for multi-step flows",
        text: "A flow becomes a chain of notes: order placed → payment taken → kitchen accepts. If the kitchen says no, compensating “undo” notes refund the payment and cancel the order. **Use when:** steps span services with no shared transaction. **Watch out for:** every step needs an undo, and the system is briefly inconsistent between steps.",
        tags: ["Real term: saga"] },
      { level: 5, kind: "panel", art: "patRetry", step: 5, headline: "Retry topics and a dead-letter topic",
        text: "A failed note goes to a “try again later” tray; after a few tries, to the lost-and-found box for people to inspect. **Use when:** failures are temporary, or one bad note mustn't block the rest. **Watch out for:** retrying through another topic lets later notes with the same key overtake the retried one; for order-sensitive steps, retry in place or pause that key.",
        tags: ["Real term: retry topic", "Real term: dead-letter topic"] },
      { level: 5, kind: "panel", art: "patDedupe", step: 5, headline: "Idempotent consumers",
        text: "The reader remembers the event IDs it has handled and skips repeats, ideally in the same transaction as its own write. **Use when:** always with at-least-once delivery, and with any system outside Kafka. **Watch out for:** the list of seen IDs grows; keep IDs as long as duplicates can still arrive, and let the producer set each ID once.",
        tags: ["Real term: idempotent consumer", "Real term: delivery guarantee"] },
      { level: 5, kind: "decision", className: "span-all", decision: {
        chose: "Outbox plus idempotent consumers for orders and payments.",
        rejected: "Writing to the database and to Kafka separately (a dual write).",
        why: "A crash between the two writes leaves them disagreeing. With the outbox, one database write is the source of truth." } }
    ]
  },
  {
    id: "p36-data-contracts", part: 6, title: "Data contracts: note format rules",
    blocks: [
      { level: 5, kind: "panel", art: "formatPoster", step: 4, headline: "A poster at every board",
        text: "Every board gets a “note format rules” poster: a schema in Avro, Protobuf or JSON Schema, kept in a schema registry, a separate service and not part of Apache Kafka, which checks every new version. A sender can't pin a note that breaks the rules, so readers aren't surprised at dinner time.",
        tags: ["Real term: schema", "Real term: schema registry"] },
      { level: 5, kind: "panel", art: "compatModes", step: 4, headline: "Can old readers still read new notes?",
        text: "Backward: readers on the new format can read old notes, so upgrade readers first. Forward: readers on the old format can read new notes, so upgrade senders first. Full: both. Adding an optional field with a default is usually safe; renaming or removing a required field usually isn't.",
        tags: ["Real term: compatibility mode"] },
      { level: 5, kind: "text", step: 4, headline: "Naming and versions",
        text: "Name events for what happened, in the past tense: OrderPlaced, PaymentTaken. Give every event an event ID, a time and a schema version. Make breaking changes on a new board, such as orders.v2, and let readers move across in their own time instead of surprising them.",
        tags: ["Real term: event", "Real term: idempotent consumer"] },
      { level: 5, kind: "text", step: 4, headline: "Personal data",
        text: "Keep personal data out of notes where you can: Kitchen doesn't need Riya's phone number. Point to a protected store with an ID, or mask the field. Notes are kept, copied to other regions and replayed, and compacted boards can keep a value for a long time, so removing personal data later is hard.",
        tags: ["Real term: retention", "Real term: log compaction"] },
      { level: 5, kind: "decision", decision: {
        chose: "Backward compatibility for orders, enforced by the registry.",
        rejected: "Free-form JSON with no schema.",
        why: "Four teams read orders. One silent field change could break all of them during the dinner rush." } }
    ]
  },
